<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Öğrenci Takip – Ankara Dil Akademisi</title>
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#9bcd56">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Öğrenci Takip">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>:root {
  --bg: #f4f8ee;
  --surface: #ffffff;
  --surface2: #ecf3e1;
  --border: #dfe8d1;
  --text: #1e2418;
  --muted: #66735a;
  --brand: #9bcd56;
  --brand2: #7ab13a;
  --accent: #47791d;
  --accent-ink: #ffffff;
  --accent-soft: #e9f4d7;
  --ok: #2b7a44;
  --ok-soft: #e0f3e5;
  --warn: #94660c;
  --warn-soft: #fcf0d5;
  --bad: #b1382c;
  --bad-soft: #fdeae6;
  --sky: #2a6d8e;
  --sky-soft: #e2f0f6;
  --lilac: #6b5ea8;
  --lilac-soft: #edeaf8;
  --logo-chip: transparent;
  --logo-filter: none;
  --logo-navy: #283C58;
  --chart: #47791d;
  --shadow: 0 1px 2px rgba(38, 56, 20, .06), 0 4px 16px rgba(38, 56, 20, .07);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151a10;
    --surface: #1d2416;
    --surface2: #27311c;
    --border: #35422a;
    --text: #eaf1e1;
    --muted: #a0ad92;
    --brand: #9bcd56;
    --brand2: #b7de7d;
    --accent: #a8d36c;
    --accent-ink: #16230a;
    --accent-soft: #2c3b1c;
    --ok: #6ecb8e;
    --ok-soft: #1f3826;
    --warn: #e2b566;
    --warn-soft: #3b2f14;
    --bad: #f08d7e;
    --bad-soft: #40201a;
    --sky: #7fc2de;
    --sky-soft: #1d3542;
    --lilac: #b2a7e6;
    --lilac-soft: #2d2845;
    --logo-chip: transparent;
    --logo-filter: invert(1) hue-rotate(185deg) brightness(1.15);
    --logo-navy: #dfe6f2;
    --chart: #74a63d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 4px 16px rgba(0, 0, 0, .28);
  }
}
:root[data-theme="dark"] {
  --bg: #151a10;
  --surface: #1d2416;
  --surface2: #27311c;
  --border: #35422a;
  --text: #eaf1e1;
  --muted: #a0ad92;
  --brand: #9bcd56;
  --brand2: #b7de7d;
  --accent: #a8d36c;
  --accent-ink: #16230a;
  --accent-soft: #2c3b1c;
  --ok: #6ecb8e;
  --ok-soft: #1f3826;
  --warn: #e2b566;
  --warn-soft: #3b2f14;
  --bad: #f08d7e;
  --bad-soft: #40201a;
  --sky: #7fc2de;
  --sky-soft: #1d3542;
  --lilac: #b2a7e6;
  --lilac-soft: #2d2845;
  --logo-chip: transparent;
  --logo-filter: invert(1) hue-rotate(185deg) brightness(1.15);
  --logo-navy: #dfe6f2;
  --chart: #74a63d;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 4px 16px rgba(0, 0, 0, .28);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 14.5px;
  line-height: 1.5;
}
a { color: var(--accent); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
button { font: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.brandbar {
  height: 5px;
  background: linear-gradient(90deg, var(--brand) 0%, var(--brand2) 55%, var(--accent) 100%);
}

/* ---------- giriş ekranı ---------- */
.login-wrap {
  min-height: calc(100vh - 5px);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  background:
    radial-gradient(900px 480px at 12% -10%, var(--accent-soft) 0%, transparent 60%),
    radial-gradient(700px 420px at 105% 110%, var(--surface2) 0%, transparent 55%),
    var(--bg);
}
.login-card {
  width: 380px; max-width: 100%;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px; box-shadow: var(--shadow);
  padding: 34px 32px 30px; text-align: center;
}
.login-card .logo-chip { display: inline-block; padding: 10px 14px; border-radius: 12px; background: var(--logo-chip); }
.login-card img { max-width: min(240px, 100%); height: auto; display: block; }
.login-card h1 { font-size: 19px; margin: 18px 0 4px; letter-spacing: -.01em; }
.login-card .sub { color: var(--muted); font-size: 13.5px; margin-bottom: 22px; }
.login-card input[type=password] {
  width: 100%; text-align: center; font-size: 20px; letter-spacing: .35em;
  padding: 11px 12px; border-radius: 12px;
}
.login-card .btn { width: 100%; justify-content: center; margin-top: 12px; padding: 11px; font-size: 15px; border-radius: 12px; }
.login-err { color: var(--bad); font-size: 13px; font-weight: 600; margin-top: 10px; min-height: 18px; }
.login-foot { margin-top: 18px; font-size: 12px; color: var(--muted); }

/* ---------- iskelet ---------- */
.layout { display: flex; min-height: calc(100vh - 5px); }
.sidebar {
  width: 236px; flex: 0 0 236px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 16px 12px;
  position: sticky; top: 52px; height: calc(100vh - 52px); /* v30: üst çubuğun altında durur */
  display: flex; flex-direction: column; gap: 4px;
  overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; /* v27: menü uzayınca kendi içinde kayar */
}
/* v30: yönetim panelindeki gibi menü bölüm başlıkları */
.nav-sec {
  font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
  color: var(--muted); padding: 12px 8px 4px;
}
.nav-sec:first-child { padding-top: 4px; }
.sidebar .nav { flex: 1 1 auto; min-height: 0; }
.sidebar .side-foot { flex: 0 0 auto; }
.brand { padding: 4px 6px 14px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
.brand .logo-chip { display: block; padding: 8px 10px; border-radius: 10px; background: var(--logo-chip); }
.brand img { width: 100%; max-width: 190px; height: auto; display: block; }
.brand > .kicker { display: block; margin-top: 8px; font-size: 11.5px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
.nav-link {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 11px; border-radius: 10px;
  color: var(--text); font-weight: 500; font-size: 14px;
  border: 0; background: transparent; width: 100%; text-align: left;
}
.nav-link:hover { background: var(--surface2); text-decoration: none; }
.nav-link.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.nav-link svg { width: 17px; height: 17px; flex: 0 0 17px; stroke: currentColor; }
.side-foot { margin-top: auto; padding: 10px 6px; font-size: 12px; color: var(--muted); }
.side-foot .out { color: var(--muted); font-size: 12px; }

/* v30: yönetim paneli tarzı kalıcı üst çubuk — masaüstünde breadcrumb, mobilde ☰ + logo + arama */
.topbar {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 18px; height: 52px;
  position: sticky; top: 0; z-index: 50;
}
.mobile-only { display: none !important; }
.crumbbar { font-size: 13.5px; color: var(--muted); display: flex; align-items: center; min-width: 0; white-space: nowrap; overflow: hidden; }
.crumbbar a { color: var(--muted); }
.crumbbar a:hover { color: var(--accent); text-decoration: none; }
.crumbbar b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.crumbbar .sep { margin: 0 8px; color: var(--border); }
.top-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.user-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--muted); background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; }
.user-chip .avatar { width: 22px; height: 22px; font-size: 10px; flex-basis: 22px; }

.main { flex: 1; min-width: 0; padding: 26px 34px 60px; }
.crumb { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.crumb a { color: var(--muted); }
.crumb .sep { margin: 0 6px; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; text-wrap: balance; }
.page-head .sub { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- kartlar / sayaçlar ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: var(--shadow);
}
.card + .card, .section + .section { margin-top: 18px; }
.card-pad { padding: 18px 20px; }
.card-title { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin: 0 0 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(152px, 1fr)); gap: 12px; }
/* masaüstünde kartlar 4'lü satıra oturur; 5'li ve 6'lı gruplar tek başına kart bırakmasın diye
   kendi satır düzenlerini alır (:has desteklenmeyen tarayıcıda 4'lü düzene düşer) */
@media (min-width: 900px) {
  .tiles { grid-template-columns: repeat(4, 1fr); }
  .tiles:has(> :nth-child(5):last-child) { grid-template-columns: repeat(5, 1fr); }
  .tiles:has(> :nth-child(6):last-child) { grid-template-columns: repeat(3, 1fr); }
  /* v25: 7'li ve 8'li gruplar (Gün Sonu Raporu KPI'ları) 4+3 / 4+4 dizilsin, 7+1 kırılmasın */
  .tiles:has(> :nth-child(7):last-child), .tiles:has(> :nth-child(8):last-child) { grid-template-columns: repeat(4, 1fr); }
}
@media (min-width: 600px) and (max-width: 899.9px) {
  .tiles { grid-template-columns: repeat(3, 1fr); }
  .tiles:has(> :nth-child(8):last-child), .tiles:has(> :nth-child(4):last-child) { grid-template-columns: repeat(4, 1fr); }
}
.tile {
  border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px;
  box-shadow: var(--shadow); background: var(--surface);
  border-top: 3px solid var(--brand);
}
.tile .n { font-size: 27px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.tile .l { font-size: 12.5px; color: var(--muted); margin-top: 2px; font-weight: 500; }
.tile.t-green { background: var(--accent-soft); border-color: transparent; border-top-color: var(--accent); }
.tile.t-green .n { color: var(--accent); }
.tile.t-amber { background: var(--warn-soft); border-color: transparent; border-top-color: var(--warn); }
.tile.t-amber .n { color: var(--warn); }
.tile.t-sky { background: var(--sky-soft); border-color: transparent; border-top-color: var(--sky); }
.tile.t-sky .n { color: var(--sky); }
.tile.t-lilac { background: var(--lilac-soft); border-color: transparent; border-top-color: var(--lilac); }
.tile.t-lilac .n { color: var(--lilac); }
.tile.t-red { background: var(--bad-soft); border-color: transparent; border-top-color: var(--bad); }
.tile.t-red .n { color: var(--bad); }

/* ---------- tablolar ---------- */
.twrap { overflow-x: auto; border-radius: 14px; }
table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.data th {
  text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--accent); font-weight: 700; padding: 10px 12px;
  border-bottom: 2px solid var(--brand); white-space: nowrap;
  background: var(--surface);
}
table.data td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.data tr:last-child td { border-bottom: 0; }
table.data tr.rowlink { cursor: pointer; }
table.data tr.rowlink:hover td { background: var(--surface2); }
/* v30: yönetim paneli tarzı — her satırda hafif hover */
table.data tbody tr:hover td { background: color-mix(in srgb, var(--surface2) 55%, transparent); }
/* v30: tıklanınca sıralanan başlıklar */
table.data th.sirala { cursor: pointer; user-select: none; }
table.data th.sirala:hover { color: var(--brand2); }
table.data th.sirala::after { content: '↕'; margin-left: 5px; opacity: .35; font-size: 10px; }
table.data th.sirala.artan::after { content: '↑'; opacity: 1; }
table.data th.sirala.azalan::after { content: '↓'; opacity: 1; }
/* sayı sütunları: başlık da gövde de sağa yaslı olmalı —
   `table.data th` kuralı (0,1,2) `th.num`'dan (0,1,1) daha özgül olduğu için
   seçici tablo adıyla birlikte yazılıyor, yoksa başlıklar solda kalıyordu. */
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.dim { color: var(--muted); }
.small { font-size: 12.5px; }

/* ---------- rozetler ---------- */
.chip {
  display: inline-block; padding: 2px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap;
  background: var(--surface2); color: var(--muted);
}
.chip.grp-ileri { background: var(--accent-soft); color: var(--accent); }
.chip.grp-pro { background: var(--warn-soft); color: var(--warn); }
.chip.grp-temel { background: var(--sky-soft); color: var(--sky); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.src { background: var(--surface2); color: var(--muted); font-weight: 500; }

.avatar {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-soft), var(--surface2));
  color: var(--accent); border: 1px solid var(--border);
  font-weight: 700; font-size: 13px; flex: 0 0 34px;
}
.avatar.big { width: 58px; height: 58px; font-size: 20px; flex-basis: 58px; }
.who { display: flex; align-items: center; gap: 10px; }

/* ---------- butonlar ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 15px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font-weight: 600; font-size: 13.5px;
}
.btn:hover { background: var(--surface2); text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { padding: 4px 11px; font-size: 12.5px; border-radius: 8px; }
.btn:disabled { opacity: .55; cursor: default; }

/* ---------- araç çubukları / formlar ---------- */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .grow { flex: 1; }
/* input:not([type]) = tür yazılmamış metin kutuları (hızlı arama, form alanları) — v24: koyu temada beyaz zemin + açık yazı sorununun düzeltmesi */
input:not([type]), input[type=text], input[type=search], input[type=password], input[type=date], input[type=time], input[type=number], select, textarea {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 7px 11px; font-size: 13.5px; min-width: 0;
}
input[type=search] { width: 260px; max-width: 100%; }
textarea { width: 100%; resize: vertical; }
select { padding-right: 26px; }

.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 12px 14px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.field input, .field select { width: 100%; }
.field.wide { grid-column: 1 / -1; }
.form-actions { display: flex; gap: 10px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
fieldset { border: 0; padding: 0; margin: 0 0 6px; min-width: 0; }
legend { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); padding: 0; margin-bottom: 10px; }

.ac-box { position: relative; }
.ac-list {
  position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px);
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: var(--shadow); max-height: 260px; overflow-y: auto;
}
.ac-item { padding: 8px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; }
.ac-item:hover, .ac-item.sel { background: var(--surface2); }
.ac-item .dim { font-variant-numeric: tabular-nums; }

/* ---------- profil ---------- */
.profile-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.profile-head h1 { margin: 0; font-size: 21px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px 22px; }
.ifield .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.ifield .v { font-weight: 500; margin-top: 1px; overflow-wrap: anywhere; }

.tabs { display: inline-flex; background: var(--surface2); border-radius: 11px; padding: 3px; gap: 2px; margin-bottom: 16px; }
.tab {
  border: 0; background: transparent; color: var(--muted);
  padding: 6px 15px; border-radius: 9px; font-weight: 600; font-size: 13.5px;
}
.tab.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }

.iv-card { border: 1px solid var(--border); border-left: 4px solid var(--brand); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
.iv-card + .iv-card { margin-top: 12px; }
.iv-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 11px 16px; border-bottom: 1px solid var(--border);
}
.iv-head b { font-variant-numeric: tabular-nums; }
.iv-body { padding: 13px 16px; }
.iv-facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; margin-bottom: 8px; }
.iv-facts span { color: var(--muted); }
.iv-facts b { font-weight: 600; color: var(--text); }
.iv-note { margin: 8px 0 0; font-size: 13.5px; max-width: 72ch; }
.iv-note .k { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); display: block; }

/* ---------- durum / bildirim ---------- */
.banner {
  padding: 9px 14px; border-radius: 12px; font-size: 13px; font-weight: 500;
  margin-bottom: 16px; background: var(--warn-soft); color: var(--warn);
}
#toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
  background: var(--accent); color: var(--accent-ink);
  padding: 10px 20px; border-radius: 12px; font-size: 13.5px; font-weight: 600;
  box-shadow: var(--shadow); z-index: 100; opacity: 0; pointer-events: none;
  transition: opacity .25s; max-width: 90vw; text-align: center;
}
#toast.show { opacity: 1; }
#toast.err { background: var(--bad); color: #fff; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }

.spin {
  display: inline-block; width: 15px; height: 15px; border-radius: 50%;
  border: 2px solid var(--accent-soft); border-top-color: var(--accent);
  animation: spin 1s linear infinite; vertical-align: -2px;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.5s; } }

.empty { padding: 34px 20px; text-align: center; color: var(--muted); font-size: 13.5px; }

/* ---------- duyarlı ---------- */
@media (max-width: 900px) {
  .layout { display: block; }
  .sidebar {
    position: fixed; z-index: 60; left: 0; top: 0; height: 100vh;
    transform: translateX(-105%); transition: transform .2s; box-shadow: var(--shadow);
  }
  @media (prefers-reduced-motion: reduce) { .sidebar { transition: none; } }
  .sidebar.open { transform: translateX(0); }
  .scrim { position: fixed; inset: 0; background: rgba(15, 22, 8, .45); z-index: 55; }
  .topbar { padding: 0 12px; height: 50px; }
  .topbar .logo-chip { padding: 4px 8px; border-radius: 8px; background: var(--logo-chip); }
  .topbar img { height: 22px; width: auto; display: block; }
  .mobile-only { display: inline-flex !important; }
  .crumbbar, .top-right { display: none; } /* mobilde ☰ + logo + arama kalır */
  .topbar .gs-box { display: block; }
  .main { padding: 18px 14px 60px; }
  input[type=search] { width: 100%; }
}
@media print {

<script>'use strict';
/* Öğrenci Takip – Ankara Dil Akademisi
   Veri: Google Sheet (Apps Script). Giriş şifresi sunucuda doğrulanır;
   her kayıt google.script.run.saveAction ile Sheet'e yazılır ve sunucu
   güncel verinin tamamını döndürür. */

let DB = null;      /* sunucudan gelen veri */
let PASS = null;    /* doğrulanan şifre (oturumda tutulur) */
let ROL = 'admin';  /* 'admin' | 'viewer' — sunucu belirler */
let USER = '';      /* girilen kullanıcı adı */
let ADIM = '';      /* sunucunun tanıdığı tam ad (örn. "Ümit Hoca") */

/* ---------- yardımcılar ---------- */
const $ = sel => document.querySelector(sel);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const GUNLER = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
const AYLAR = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];

function fmtDate(iso, withDay) {
  if (!iso || !/^\d{4}-\d{2}-\d{2}/.test(iso)) return iso || '';
  const [y, m, d] = iso.slice(0, 10).split('-').map(Number);
  const s = d + ' ' + AYLAR[m - 1] + ' ' + y;
  if (!withDay) return s;
  return s + ' ' + GUNLER[new Date(y, m - 1, d).getDay()];
}
function fmtPhone(t) {
  if (!t) return '';
  if (!/^\d{10}$/.test(t)) return t; /* izleyicide maskeli gelir, aynen göster */
  return '0' + t.slice(0, 3) + ' ' + t.slice(3, 6) + ' ' + t.slice(6, 8) + ' ' + t.slice(8);
}
function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function nowHM() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function initials(name) {
  return String(name).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toLocaleUpperCase('tr')).join('');
}
function grpChip(g) {
  if (!g) return '';
  const cls = g.includes('Pro') ? 'grp-pro' : g.includes('Temel') ? 'grp-temel' : 'grp-ileri';
  return '<span class="chip ' + cls + '">' + esc(g) + '</span>';
}
function durumChip(d) {
  const cls = /Tamamlandı|Kapandı/.test(d) ? 'ok' : /Beklemede|Takipte|Devam|İzinli/.test(d) ? 'warn' : /Açık|İptal/.test(d) ? 'bad' : '';
  return '<span class="chip ' + cls + '">' + esc(d || '—') + '</span>';
}
function sonGorusme(st) {
  let best = '';
  for (const iv of st.gorusmeler) if (iv.tarih > best) best = iv.tarih;
  return best;
}
function stById(id) { return DB.students.find(s => s.id === id); }
const SRC_AD = { gunluk: 'Günlük rapor', onceki: 'Önceki dönem', progrup: 'Pro Grup arşivi', yeni: 'Panelden', 'ts-canli': 'TS Canlı Arama', 'ts-kayittan': 'TS Kayıttan Arama' };

function normTel(t) {
  let d = (t || '').replace(/\D/g, '');
  if (d.length > 10) d = d.slice(-10);
  return d.length === 10 ? d : '';
}
function avatarClass(name) {
  let h = 0; const s = String(name);
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return 'av-' + (h % 5 + 1);
}
function ilkAd(name) {
  const p = String(name).trim().split(/\s+/)[0] || '';
  return p.charAt(0).toLocaleUpperCase('tr') + p.slice(1);
}
/* Kayitlarin imzasi (kim girdi). v34 veri hijyeni (26.09.2026): kanonik ad 'Kubilay Kenan Hoca' —
   göç öncesi kalan 'Kenan Hoca' imzaları görünümde tam ada katlanır (v33'e kadar tersiydi). */
const AD_KANON = { 'Kenan Hoca': 'Kubilay Kenan Hoca' };
function kimAd(a) { const s = String(a || '').trim(); return AD_KANON[s] || s; }
/* selamlama hitabı: tam ad 'Kubilay Kenan Hoca' olsa da hitap 'Kenan Hocam' kalır */
function hitapAd(name) {
  const s = String(name || '').trim();
  if (/^Kubilay\s+Kenan\b/i.test(s)) return 'Kenan';
  return ilkAd(s);
}
function kimChip(a) { const s = kimAd(a); return s ? '<span class="chip src" title="Kaydı giren">✍ ' + esc(s) + '</span>' : ''; }
/* sunucudaki adAnahtari() ile ayni normalizasyon (TR harfleri katlanir) */
function adKey(x) {
  return String(x == null ? '' : x).trim().toLocaleLowerCase('tr')
    .replace(/i̇/g, 'i').replace(/ı/g, 'i').replace(/ç/g, 'c').replace(/ğ/g, 'g')
    .replace(/ö/g, 'o').replace(/ş/g, 's').replace(/ü/g, 'u').replace(/[^a-z0-9]/g, '');
}
/* arama katlama: Türkçe harfler Latin karşılığına iner (ş→s, ı→i, İ→i …), aksanlar düşer, boşluklar teke iner.
   "serife" yazınca "Şerife", "GUL" yazınca "Gül" bulunur; iki yönde de uygulanır. */
function aramaKatla(x) {
  return String(x == null ? '' : x).toLocaleLowerCase('tr')
    .replace(/i̇/g, 'i').replace(/ı/g, 'i').replace(/ç/g, 'c').replace(/ğ/g, 'g')
    .replace(/ö/g, 'o').replace(/ş/g, 's').replace(/ü/g, 'u').replace(/â/g, 'a').replace(/î/g, 'i').replace(/û/g, 'u')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
}
/* ---- v25 yardımcıları ---- */
/* WhatsApp bağlantısı: 10 haneli telefon → wa.me/90…; metin verilirse sohbet hazır yazılmış açılır (Android/iPhone/Web fark etmez) */
function waLink(tel, metin) {
  const d = normTel(tel);
  if (!d) return '';
  return 'https://wa.me/90' + d + (metin ? '?text=' + encodeURIComponent(metin) : '');
}
function waChip(tel, metin, etiket) {
  const u = waLink(tel, metin);
  return u ? '<a class="chip wa" href="' + esc(u) + '" target="_blank" rel="noopener" title="WhatsApp\'ta aç">' + (etiket || '💬 WhatsApp') + '</a>' : '';
}
/* v34.1 tarih birliği: 'GG.AA.YYYY[ SS:DD]', yılsız 'GG.AA' ve ISO girişlerini 'YYYY-MM-DD'ye indirir
   (sunucudaki tarihNorm'un istemci eşi; göç öncesi/dış kaynaklı satırlar da doğru sıralansın).
   Noktalı kalıp baştan sona eşleşmeli ve takvimde geçerli olmalı; değilse '' döner. Yılsız tarih:
   enYakin ise bugüne en yakın yıl (hedef tarihleri), değilse bu yıl — bugünden ileriGun'den fazla
   ileri düşerse geçen yıl (açılış/eklenme). */
function isoGun(s, ileriGun, enYakin) {
  s = String(s == null ? '' : s).trim();
  const gecerli = (y, a, g) => { const d = new Date(y, a - 1, g); return a >= 1 && a <= 12 && d.getFullYear() === y && d.getMonth() === a - 1 && d.getDate() === g; };
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return gecerli(+m[1], +m[2], +m[3]) ? m[1] + '-' + m[2] + '-' + m[3] : '';
  m = s.match(/^(\d{1,2})\.(\d{1,2})(?:\.(\d{4}))?(?:\s+\d{1,2}:\d{2}(?::\d{2})?)?$/);
  if (!m) return '';
  const ay = +m[2], gg = +m[1];
  let yil = m[3] ? +m[3] : 0;
  if (!yil) {
    const bugun = todayISO(), buYil = +bugun.slice(0, 4);
    if (enYakin) {
      const b = new Date(buYil, +bugun.slice(5, 7) - 1, +bugun.slice(8, 10)).getTime();
      yil = [buYil - 1, buYil + 1].reduce((en, y) => Math.abs(new Date(y, ay - 1, gg) - b) < Math.abs(new Date(en, ay - 1, gg) - b) ? y : en, buYil);
    } else {
      yil = buYil;
      if (yil + '-' + String(ay).padStart(2, '0') + '-' + String(gg).padStart(2, '0') > gunEkle(bugun, ileriGun || 30)) yil = buYil - 1;
    }
  }
  return gecerli(yil, ay, gg) ? yil + '-' + String(ay).padStart(2, '0') + '-' + String(gg).padStart(2, '0') : '';
}
/* sıralama anahtarı: gün + (varsa) saat — 'YYYY-MM-DD SS:DD' */
function tarihTam(s) {
  const g = isoGun(s, 7);
  const sa = String(s == null ? '' : s).match(/(\d{1,2}):(\d{2})/);
  return g ? g + (sa ? ' ' + sa[1].padStart(2, '0') + ':' + sa[2] : '') : String(s || '');
}
/* iso tarih bugünden kaç gün önce (negatif = ileride) */
function gunFarki(iso) {
  if (!iso) return null;
  const [y, m, d] = iso.split('-').map(Number); const [ty, tm, td] = todayISO().split('-').map(Number);
  return Math.round((new Date(ty, tm - 1, td) - new Date(y, m - 1, d)) / 86400000);
}
function sablonMetni(t, st) { return t.metin.replace(/\{AD\}/g, st ? ilkAd(st.ad) : '{AD}'); }
/* sınav takvimi: Ayarlar.sinavTakvimi JSON dizisi [{id, ad, anahtar, tarih, bas, bit}]; boşsa varsayılan */
const VARSAYILAN_TAKVIM = [{ id: 'sv1', ad: 'YDS/2 2026', anahtar: 'YDS', tarih: '2026-11-22', bas: '2026-09-30', bit: '2026-10-08' }];
function sinavTakvimi() {
  try { const t = JSON.parse(DB.settings.sinavTakvimi || ''); if (Array.isArray(t)) return t; } catch (e) {}
  return VARSAYILAN_TAKVIM.slice();
}
function sinavTokens(txt) { return aramaKatla(txt).replace(/e-yds/g, 'eyds').replace(/e-yokdil/g, 'eyokdil').split(/[^a-z0-9]+/).filter(Boolean); }
/* sınavı hedefleyenler: kesin = son görüşmedeki Yakın Sınav eşleşiyor; olası = son sınav / sınav alanı eşleşiyor */
function sinavHedefleyenler(sv) {
  const anahtar = sinavTokens(sv.anahtar || sv.ad);
  const kesin = [], olasi = [];
  if (!anahtar.length) return { kesin, olasi };
  const uyar = txt => { const tok = sinavTokens(txt || ''); return anahtar.every(a => tok.includes(a)); };
  DB.students.forEach(st => {
    const son = st.gorusmeler.slice().sort((a, b) => ((b.tarih || '') + (b.saat || '')).localeCompare((a.tarih || '') + (a.saat || '')))[0] || {};
    if (son.yakinSinav && uyar(son.yakinSinav)) kesin.push(st);
    else if (uyar([son.sinav, st.sonSinav].filter(Boolean).join(' '))) olasi.push(st);
  });
  return { kesin, olasi };
}
/* ders almış (panel siparişi geçerli ya da Kayıt oldu) ama esik günden uzun süredir görüşülmemiş öğrenciler */
function temassizListesi(esik) {
  const satislar = DB.satislar || [];
  const alici = new Set(satislar.filter(r => r.ogrenciId && satisGecerli(r)).map(r => r.ogrenciId));
  const kuyrukta = new Set(DB.queue.filter(q => q.durum === 'Bekliyor' && q.ogrenciId).map(q => q.ogrenciId));
  return DB.students.filter(st => alici.has(st.id) || st.kayitDurumu === 'Kayıt oldu').map(st => {
    const son = sonGorusme(st);
    const gun = son ? gunFarki(son) : null;
    const urun = satislar.filter(r => r.ogrenciId === st.id && satisGecerli(r)).sort((a, b) => (b.tarih || '').localeCompare(a.tarih || ''))[0];
    return { st, son, gun, urun: urun ? urun.urun : '', kuyrukta: kuyrukta.has(st.id) };
  }).filter(x => x.gun === null || x.gun > esik).sort((a, b) => (b.gun === null ? 9999 : b.gun) - (a.gun === null ? 9999 : a.gun));
}
function haftaBasi(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() - (dt.getDay() + 6) % 7);
  return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
}
function gunEkle(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d + n);
  return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
}
function sayi(v) {
  const n = parseFloat(String(v == null ? '' : v).replace(',', '.'));
  return isNaN(n) ? null : n;
}
/* ---------- v37: DELTA YANIT ----------
   Sunucu bölüm damgaları tutuyor; istemci elindekini gönderiyor, yalnız değişen
   bölümler geliyor. Tam veri localStorage'da saklanır — değişiklik yoksa yanıt
   birkaç KB ve açılış anında biter. Depolama dolarsa önbellek kapanır, akış eskisi gibi çalışır. */
const ONB = 'kh-onb', ONB_ARAMA = 'kh-onb-arama';
let HAM = null;          /* sunucudan gelen ham bölümlerin birleşimi */
let REV = null;          /* elimizdeki bölüm damgaları */
let onbKapali = false;   /* kota hatası olursa true */

function onbellekOku(user) {
  try {
    const h = JSON.parse(lsGet(ONB) || 'null');
    return (h && h.user === user && h.data) ? h : null;
  } catch (e) { return null; }
}
function onbellekYaz(user, rol, rev, ham) {
  if (onbKapali) return;
  const paket = JSON.stringify({ user: user, rol: rol, ad: ADIM, rev: rev, data: ham, zaman: Date.now() });
  try { localStorage.setItem(ONB, paket); }
  catch (e) {
    lsDel(ONB_ARAMA); /* önce büyük listeyi bırak, bir daha dene */
    try { localStorage.setItem(ONB, paket); }
    catch (e2) { onbKapali = true; lsDel(ONB); }
  }
}
function onbellekSil() { lsDel(ONB); lsDel(ONB_ARAMA); HAM = null; REV = null; }
/* gelen yanıtı (tam ya da delta) uygula: HAM + önbellek + DB tazelenir */
function veriUygula(y, user, rol) {
  let ham;
  if (y && y.delta) {
    const temel = HAM || ((onbellekOku(user) || {}).data) || {};
    ham = Object.assign({}, temel, y.bolumler || {});
    ham.rev = y.rev;
  } else {
    ham = y;
  }
  HAM = ham;
  REV = ham.rev || null;
  onbellekYaz(user, rol, REV, ham);
  DB = normalizeDB(ham);
  return DB;
}

function normalizeDB(d) {
  d.queue = d.queue || [];
  d.templates = d.templates || [];
  d.trash = d.trash || [];
  d.settings = d.settings || {};
  d.agsAdaylar = d.agsAdaylar || [];
  d.satislar = d.satislar || [];
  d.kisiler = d.kisiler || [];
  /* v34.1: göç öncesi / dış kaynaklı satırlardaki noktalı tarihler görünümde ISO'ya iner —
     "gecikti" / "bugün" karşılaştırmaları ve tarih girdileri tek biçimle çalışsın */
  (d.followups || []).forEach(f => {
    const a = isoGun(f.acilis, 7); if (a) f.acilis = a;
    const h = isoGun(f.hedefTarih, 330, true); if (h) f.hedefTarih = h;
  });
  return d;
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

/* ---------- sunucu köprüsü ----------
   İki kip (v30): Apps Script iframe'inde google.script.run; iframe dışında
   (GitHub Pages / yerel dist) EXEC_URL'e fetch ile doPost {action:'rpc'}.
   Content-Type text/plain "basit istek"tir — CORS ön kontrolü tetiklemez,
   Apps Script'in googleusercontent yönlendirmesi yanıtı herkese açar. */
function srv(fn) {
  const args = [].slice.call(arguments, 1);
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(e => reject(e instanceof Error ? e : new Error(e && e.message ? e.message : String(e))));
      runner[fn].apply(runner, args);
    });
  }
  const url = (typeof EXEC_URL !== 'undefined' && EXEC_URL) || '';
  if (!url) return Promise.reject(new Error('EXEC_URL tanımsız — bu derleme yalnız site içinde çalışır'));
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'rpc', fn: fn, args: args }),
    redirect: 'follow'
  }).then(r => {
    if (!r.ok) throw new Error('Sunucuya ulaşılamadı (HTTP ' + r.status + ')');
    return r.json();
  }).then(j => {
    if (!j || j.ok !== true) throw new Error((j && j.error) || 'Sunucu hatası');
    return j.sonuc;
  });
}
function toast(msg, ms, isErr) {
  const t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), ms || 2800);
}
async function persist(action, payload, flashMsg) {
  if (ROL !== 'admin') {
    toast('Salt-okunur görünümdesiniz — değişiklik yapılamaz.', 3800, true);
    return false;
  }
  const btns = document.querySelectorAll('button[type=submit],[data-action]');
  btns.forEach(b => { if (b.tagName === 'BUTTON') b.disabled = true; });
  try {
    const data = await srv('saveAction', USER, PASS, action, Object.assign({ _rev: REV }, payload));
    veriUygula(data, USER, ROL);
    render();
    toast(flashMsg + ' ✓');
    return true;
  } catch (e) {
    toast('Kaydedilemedi: ' + e.message, 4600, true);
    return false;
  } finally {
    /* render() yalnız #view'ı yeniler; menü/tema düğmeleri (sidebar, topbar) kilitli kalmasın */
    btns.forEach(b => { if (b.tagName === 'BUTTON' && b.isConnected) b.disabled = false; });
  }
}
function downloadCSV(filename, rows) {
  const sep = ';';
  const body = rows.map(r => r.map(c => {
    const s = String(c == null ? '' : c);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(sep)).join('\r\n');
  const blob = new Blob(['\uFEFF' + body], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

function copyText(text) {
  const done = () => toast('Özet kopyalandı — WhatsApp\'ta yapıştırabilirsiniz ✓');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      if (ok) { done(); return; }
    } catch (e) {}
    const ov = document.createElement('div');
    ov.className = 'copy-overlay';
    ov.innerHTML = '<div class="box"><h2 class="card-title">Özeti elle kopyalayın (Cmd/Ctrl+C)</h2><textarea readonly></textarea>' +
      '<div class="form-actions"><button class="btn primary" data-action="kopyala-kapat">Kapat</button></div></div>';
    ov.querySelector('textarea').value = text;
    ov.addEventListener('click', e => { if (e.target === ov || e.target.dataset.action === 'kopyala-kapat') ov.remove(); });
    document.body.appendChild(ov);
    ov.querySelector('textarea').select();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else fallback();
}

/* Gezinme, tarayıcı geçmişine hash olarak yazılır: trackpad'de geri
   kaydırma siteden çıkarmaz, sitenin içinde bir önceki sayfaya döner. */
function routeFromHash() {
  const h = (location.hash || '').replace(/^#/, '');
  if (!h) return null;
  const i = h.indexOf(':');
  const r = i < 0 ? { page: h, arg: '' } : { page: h.slice(0, i), arg: decodeURIComponent(h.slice(i + 1)) };
  return PAGES.indexOf(r.page) >= 0 ? r : null;
}
function applyRoute(page, arg) {
  if (ROL === 'viewer' && ADMIN_PAGES.indexOf(page) >= 0) {
    page = 'dash'; arg = '';
    toast('Bu bölüm salt-okunur görünümde kapalıdır.');
  }
  NAV.page = page; NAV.arg = arg || '';
  UI.tab = 'gorusmeler'; UI.gorevForm = false; UI.takipForm = false;
  if (page !== 'yeni') { UI.editIv = null; UI.agsPending = null; }
  UI.editTask = null; UI.editTakip = null;
  UI.msgOpen = false; UI.sablonForm = false; UI.editSablon = null; UI.hedefEdit = false;
  UI.ciroEdit = false; UI.kuyrukSihir = false; UI.agsAktar = false; /* v34 formları da gezinmede kapanır */
  render();
  window.scrollTo(0, 0);
}
function go(page, arg) {
  const hedef = '#' + page + (arg ? ':' + encodeURIComponent(arg) : '');
  if (location.hash !== hedef) {
    try { location.hash = hedef; } catch (e) {}
    if (location.hash === hedef) return; /* hashchange çizecek */
    /* Apps Script iframe'i hash değişikliğini yutar; geçmişe pushState ile yaz */
    try { history.pushState({ page: page, arg: arg || '' }, '', ''); } catch (e) {}
  }
  applyRoute(page, arg);
}
window.addEventListener('hashchange', () => {
  if (!DB) return;
  const r = routeFromHash();
  if (r) applyRoute(r.page, r.arg);
  else applyRoute('dash', '');
});
window.addEventListener('popstate', e => {
  if (!DB) return;
  if (e.state && e.state.page && PAGES.indexOf(e.state.page) >= 0) {
    applyRoute(e.state.page, e.state.arg || '');
  } else if (!location.hash) {
    applyRoute('dash', '');
  }
});

/* v30: yönetim paneli tarzı tablo sıralama — başlığa tıklayınca o sütuna göre artan/azalan.
   Sayı (25.900, %12), tarih (25 Eylül 2026 / ISO) ve Türkçe metin ayrımı otomatik;
   colspan'lı satırlar ("kalanı göster", boş durum) her zaman altta kalır. */
function tabloSirala() {
  const AY_NO = {}; AYLAR.forEach((a, i) => { AY_NO[a] = i + 1; });
  document.querySelectorAll('#view table.data').forEach(tb => {
    const thead = tb.tHead, body = tb.tBodies[0];
    if (!thead || !body || body.rows.length < 2 || !thead.rows[0]) return;
    const ths = Array.from(thead.rows[0].cells);
    ths.forEach((th, i) => {
      if (!th.textContent.trim()) return;
      th.classList.add('sirala');
      th.addEventListener('click', () => {
        const yon = th.classList.contains('artan') ? -1 : 1;
        ths.forEach(t => t.classList.remove('artan', 'azalan'));
        th.classList.add(yon === 1 ? 'artan' : 'azalan');
        const hepsi = Array.from(body.rows);
        const duz = hepsi.filter(r => !Array.from(r.cells).some(c => c.colSpan > 1));
        const altta = hepsi.filter(r => Array.from(r.cells).some(c => c.colSpan > 1));
        const metin = r => (r.cells[i] ? r.cells[i].textContent.trim() : '');
        const anahtar = s => {
          if (!s) return null;
          const trTarih = s.match(/^(\d{1,2}) (\S+) (\d{4})/);
          if (trTarih && AY_NO[trTarih[2]]) return Number(trTarih[3]) * 10000 + AY_NO[trTarih[2]] * 100 + Number(trTarih[1]);
          const t = s.replace(/[^\d,.\-]/g, '');
          if (t && /\d/.test(t)) {
            const n = parseFloat(t.replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.'));
            if (!isNaN(n)) return n;
          }
          return null;
        };
        const dolu = duz.map(metin).filter(Boolean);
        const sayisal = dolu.length && dolu.filter(s => anahtar(s) !== null).length >= dolu.length * 0.7;
        duz.map((r, idx) => ({ r, idx, s: metin(r), n: anahtar(metin(r)) }))
          .sort((a, b) => {
            let c;
            if (sayisal) {
              const av = a.n === null ? (yon === 1 ? Infinity : -Infinity) : a.n;
              const bv = b.n === null ? (yon === 1 ? Infinity : -Infinity) : b.n;
              c = av === bv ? 0 : (av < bv ? -1 : 1);
            } else c = a.s.localeCompare(b.s, 'tr');
            return (c || a.idx - b.idx) * (c ? yon : 1);
          })
          .forEach(x => body.appendChild(x.r));
        altta.forEach(r => body.appendChild(r));
      });
    });
  });
}

/* v37: kayıtlı oturumda önce ÖNBELLEKTEN aç (anında), sonra arka planda tazele.
   Apps Script isteği 2-10 sn sürebiliyor; kullanıcı o süre boyunca beklemesin. */
async function otoGiris(user, pass) {
  const onb = onbellekOku(user);
  if (!onb || !onb.data || !onb.data.students) return tryLogin(user, pass);
  try {
    PASS = pass; USER = user;
    ROL = onb.rol === 'viewer' ? 'viewer' : 'admin';
    ADIM = onb.ad || '';
    HAM = onb.data; REV = onb.rev || null;
    DB = normalizeDB(onb.data);
    document.documentElement.classList.toggle('izleyici', ROL === 'viewer');
    enterApp();
  } catch (e) { return tryLogin(user, pass); }
  /* arka planda doğrula + değişenleri al */
  try {
    const y = await srv('getData', user, pass, REV);
    const rolYeni = y.rol === 'viewer' ? 'viewer' : 'admin';
    ADIM = y.ad || ADIM;
    if (y.delta && rolYeni !== ROL) { onbellekSil(); return tryLogin(user, pass); }
    ROL = rolYeni;
    delete y.rol; delete y.ad;
    veriUygula(y, user, ROL);
    document.documentElement.classList.toggle('izleyici', ROL === 'viewer');
    render();
  } catch (e) {
    if (/hatalı|deneme/i.test(e.message || '')) { onbellekSil(); logout(); loginScreen(e.message, false); }
    else toast('Çevrimdışı görünüyorsunuz — ekrandaki veri son kayıttan', 4200, true);
  }
}

async function tryLogin(user, pass) {
  if (!pass) return;
  loginScreen('', true);
  try {
    const onb = onbellekOku(user);
    let data = await srv('getData', user, pass, onb ? onb.rev : null);
    PASS = pass; USER = user;
    ROL = data.rol === 'viewer' ? 'viewer' : 'admin';
    ADIM = data.ad || '';
    /* rol değiştiyse (maskeli/maskesiz veri) önbellek geçersiz — tam veri iste */
    if (data.delta && onb && onb.rol && onb.rol !== ROL) {
      onbellekSil();
      data = await srv('getData', user, pass, null);
    }
    delete data.rol; delete data.ad;
    veriUygula(data, user, ROL);
    lsSet('kh-user', user);
    lsSet('kh-pass', pass);
    lsSet('kh-t', String(Date.now()));
    document.documentElement.classList.toggle('izleyici', ROL === 'viewer');
    enterApp();
  } catch (e) {
    lsDel('kh-pass'); lsDel('kh-user'); lsDel('kh-t');
    loginScreen(/hatalı|deneme/i.test(e.message) ? e.message : 'Bağlantı sorunu: ' + e.message, false);
  }
}
function logout() {
  lsDel('kh-pass'); lsDel('kh-user'); lsDel('kh-t');
  onbellekSil();
  PASS = null; DB = null;
  loginScreen('', false);
}

function applyTheme(t) {
  if (t) { lsSet('kh-theme', t); document.documentElement.dataset.theme = t; }
  else { lsDel('kh-theme'); delete document.documentElement.dataset.theme; }
}
let lastAnim = '';
function animateView() {
  const v = $('#view');
  if (!v) return;
  v.classList.remove('page-enter');
  void v.offsetWidth;
  v.classList.add('page-enter');
  const key = NAV.page + ':' + NAV.arg;
  if (key === lastAnim) return;
  lastAnim = key;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  v.querySelectorAll('.tile .n').forEach(el => {
    const hedef = parseInt(el.textContent, 10);
    if (isNaN(hedef) || hedef <= 0 || String(hedef) !== el.textContent.trim()) return;
    const t0 = performance.now(), sure = 550;
    const adim = now => {
      const p = Math.min(1, (now - t0) / sure);
      el.textContent = Math.round(hedef * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(adim);
    };
    requestAnimationFrame(adim);
  });
}

/* ---------- v34: Bugünün Çalışma Listesi (madde 6) ----------
   Bugüne planlı aramalar + hedefsiz açık takipler + bayat kuyruk (15+/30+ gün) + 30+ gün açık
   görevler tek kartta. Hedef tarihi geçen takipler burada TEKRAR sayılmaz — onları hemen üstteki
   "Dönüş Sözleriniz" kartı zaten gösteriyor. Tamamen istemci hesabı, sunucu değişmez. */
function vCalismaListesi() {
  const today = todayISO();
  const bekleyen = DB.queue.filter(q => q.durum === 'Bekliyor');
  const bugunPlanli = bekleyen.filter(q => q.planTarih && q.planTarih <= today)
    .sort((a, b) => (b.oncelik === '1' ? 1 : 0) - (a.oncelik === '1' ? 1 : 0) ||
      (a.planTarih || '').localeCompare(b.planTarih || '') || tarihTam(a.eklenme).localeCompare(tarihTam(b.eklenme)));
  /* yalnız Açık: 'Beklemede' kayıtlar kişinin kendisinin dönmesi beklenen, bilinçli tarihsiz işlerdir */
  const hedefsiz = DB.followups.filter(f => f.durum === 'Açık' && !f.hedefTarih);
  const kuyrukYas = q => { const e = isoGun(q.eklenme, 7); const g = e ? gunFarki(e) : null; return g === null ? 0 : g; }; /* v34.1: '04.09.2026 12:34' biçimi de okunur */
  const bayat15 = bekleyen.filter(q => kuyrukYas(q) >= 15);
  const bayat30 = bayat15.filter(q => kuyrukYas(q) >= 30);
  const plansiz = bekleyen.filter(q => !q.planTarih);
  const eskiGorev = DB.tasks.filter(t => t.durum && !/Tamamlandı|İptal/i.test(t.durum) && t.tarih && gunFarki(t.tarih) !== null && gunFarki(t.tarih) >= 30)
    .sort((a, b) => (a.tarih || '').localeCompare(b.tarih || ''));
  if (!bugunPlanli.length && !hedefsiz.length && !bayat15.length && !eskiGorev.length) return '';

  const SINIR = 10;
  const admin = ROL === 'admin'; /* izleyicide eylem düğmeleri ve yönetici sayfası kısayolları çizilmez */
  const planRows = bugunPlanli.slice(0, UI.calismaTum ? bugunPlanli.length : SINIR).map(q =>
    '<div class="gbar temassiz-row">' +
    (q.oncelik === '1' ? '<span class="chip warn">★ öncelikli</span>' :
      q.planTarih < today ? '<span class="chip bad">' + fmtDate(q.planTarih) + ' planlıydı</span>' : '<span class="chip src">bugün planlı</span>') +
    '<span class="small">' + (q.ogrenciId ? '<a data-goto="ogrenci:' + esc(q.ogrenciId) + '"><b>' + esc(q.ad) + '</b></a>' : '<b>' + esc(q.ad) + '</b>') +
    (q.tel ? ' <span class="dim">' + esc(fmtPhone(q.tel)) + '</span>' : '') + '</span>' +
    '<span class="nowrap">' + waChip(q.tel, '', '💬') +
    (admin ? ' <button class="btn sm primary" data-action="kuyruk-arandi" data-id="' + esc(q.id) + '" data-sid="' + esc(q.ogrenciId || '') + '">✓ Aradım → Görüşme Gir</button>' : '') + '</span></div>').join('');

  const ozetler = [];
  if (hedefsiz.length) ozetler.push('<a data-goto="takip"><b>' + hedefsiz.length + '</b> hedef tarihsiz açık takip</a> — dönüş günü verin ki hatırlatma çalışsın');
  if (bayat15.length) ozetler.push((admin ? '<a data-action="kuyruk-git" data-f="bayat">' : '') + '<b>' + bayat15.length + '</b> kişi 15+ gündür kuyrukta' + (admin ? '</a>' : '') + (bayat30.length ? ' (' + bayat30.length + '\'i 30+ gün!)' : ''));
  if (plansiz.length >= 10 && admin) ozetler.push('<a data-action="kuyruk-git" data-f="plansiz"><b>' + plansiz.length + '</b> plansız kuyruk kaydı</a> — Aranacaklar\'daki 🪄 Toplu Planla ile günlere dağıtın');
  const gorevRows = eskiGorev.slice(0, 3).map(t =>
    '<div class="gbar" style="grid-template-columns:110px 1fr"><span class="chip bad">' + gunFarki(t.tarih) + ' gündür açık</span>' +
    '<span class="small"><a data-goto="rapor:' + esc(t.tarih) + '"><b>' + esc(t.gorev) + '</b></a>' + (t.durum ? ' ' + durumChip(t.durum) : '') + '</span></div>').join('');

  return '<div class="card section card-pad due-card"><h2 class="card-title">📋 Bugünün Çalışma Listesi' +
    (bugunPlanli.length ? ' — ' + bugunPlanli.length + ' arama' : '') + '</h2>' +
    (planRows || '<div class="dim small" style="margin-bottom:6px">Bugüne planlı arama yok.</div>') +
    (bugunPlanli.length > SINIR ? '<div class="small" style="margin:6px 0"><a data-action="calisma-tum">' + (UI.calismaTum ? 'Kısalt ↑' : 'Tümünü gör (' + bugunPlanli.length + ') →') + '</a></div>' : '') +
    (ozetler.length ? '<div class="small" style="margin-top:8px">' + ozetler.map(o => '⚠️ ' + o).join('<br>') + '</div>' : '') +
    (gorevRows ? '<div style="margin-top:8px"><div class="small dim" style="margin-bottom:4px">30+ gündür kapanmamış görevler (' + eskiGorev.length + ')</div>' + gorevRows + '</div>' : '') +
    '</div>';
}

function vDashboard() {
  const all = allInterviews();
  const today = todayISO();
  const bugun = all.filter(x => x.iv.tarih === today).length;
  const months = [...new Set(all.map(x => (x.iv.tarih || '').slice(0, 7)).filter(Boolean))].sort().reverse();
  if (!UI.ay || !months.includes(UI.ay)) UI.ay = months[0] || today.slice(0, 7);
  const ayAdi = m => AYLAR[Number(m.slice(5)) - 1] + ' ' + m.slice(0, 4);
  const ayIv = all.filter(x => (x.iv.tarih || '').startsWith(UI.ay));
  const acik = DB.followups.filter(f => f.durum === 'Açık').length;

  const dates = [...new Set(ayIv.map(x => x.iv.tarih).concat(DB.tasks.filter(t => (t.tarih || '').startsWith(UI.ay)).map(t => t.tarih)))].sort();
  const rows = dates.map(d => {
    const list = byDate(d);
    const s = dayStats(list);
    const nTask = DB.tasks.filter(t => t.tarih === d).length;
    const durum = s.toplam > 0 ? '<span class="chip ok">Raporlandı</span>' :
      nTask > 0 ? '<span class="chip warn">Görüşme yok</span>' : '<span class="chip">—</span>';
    return '<tr class="rowlink" data-goto="rapor:' + d + '"><td class="nowrap">' + fmtDate(d, true) + '</td>' +
      '<td class="num">' + s.toplam + '</td><td class="num">' + s.ileri + '</td><td class="num">' + s.pro + '</td>' +
      '<td class="num">' + s.temel + '</td><td class="num">' + s.yonl + '</td><td class="num">' + s.erisim + '</td>' +
      '<td class="num">' + nTask + '</td><td>' + durum + '</td></tr>';
  }).reverse().join('');

  const grupSay = {};
  DB.students.forEach(s => { const g = s.grup || 'Belirsiz'; grupSay[g] = (grupSay[g] || 0) + 1; });

  /* günlük görüşme çubuk grafiği (seçili ay) */
  const [gy, gm] = UI.ay.split('-').map(Number);
  const sonGun = new Date(gy, gm, 0).getDate();
  const gunler = [];
  for (let g = 1; g <= sonGun; g++) {
    const d = UI.ay + '-' + String(g).padStart(2, '0');
    gunler.push({ d, g, n: ayIv.filter(x => x.iv.tarih === d).length });
  }
  const maxN = Math.max(1, ...gunler.map(x => x.n));
  const W = 760, H = 168, padL = 26, padB = 22, padT = 16;
  const iw = (W - padL - 8) / gunler.length;
  const bw = Math.min(iw - 2, 20);
  const yh = H - padT - padB;
  const maxIdx = gunler.findIndex(x => x.n === maxN);
  const bars = gunler.map((x, i) => {
    const h = Math.round(x.n / maxN * yh);
    const bx = (padL + i * iw + (iw - bw) / 2).toFixed(1);
    const by = H - padB - h;
    const r = x.n > 0 ? Math.min(3, h) : 0;
    const path = x.n === 0 ? '' :
      '<path class="bar" data-goto="rapor:' + x.d + '" d="M' + bx + ',' + (H - padB) + ' v' + (-(h - r)) + ' q0,' + (-r) + ' ' + r + ',' + (-r) + ' h' + (bw - 2 * r) + ' q' + r + ',0 ' + r + ',' + r + ' v' + (h - r) + ' z">' +
      '<title>' + fmtDate(x.d, true) + ' — ' + x.n + ' görüşme</title></path>';
    const lbl = (gunler.length > 20 && x.g % 2 === 0) ? '' :
      '<text x="' + (padL + i * iw + iw / 2).toFixed(1) + '" y="' + (H - padB + 14) + '" text-anchor="middle">' + x.g + '</text>';
    const val = (i === maxIdx && x.n > 0) ? '<text class="val" x="' + (padL + i * iw + iw / 2).toFixed(1) + '" y="' + (by - 5) + '" text-anchor="middle">' + x.n + '</text>' : '';
    return path + lbl + val;
  }).join('');
  const chart = '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Günlük görüşme sayıları">' +
    '<line class="grid" x1="' + padL + '" y1="' + (H - padB - yh / 2) + '" x2="' + (W - 8) + '" y2="' + (H - padB - yh / 2) + '"/>' +
    '<line class="axis" x1="' + padL + '" y1="' + (H - padB) + '" x2="' + (W - 8) + '" y2="' + (H - padB) + '"/>' +
    '<text x="' + (padL - 6) + '" y="' + (padT + 4) + '" text-anchor="end">' + maxN + '</text>' +
    '<text x="' + (padL - 6) + '" y="' + (H - padB - yh / 2 + 4) + '" text-anchor="end">' + Math.round(maxN / 2) + '</text>' +
    bars + '</svg>';

  const gToplam = Math.max(1, ...Object.values(grupSay));
  const gruplar = Object.entries(grupSay).sort((a, b) => b[1] - a[1]).map(([g, n]) =>
    '<div class="gbar"><span class="gl">' + esc(g) + '</span>' +
    '<span class="track"><span class="fill" style="width:' + (n / gToplam * 100).toFixed(1) + '%"></span></span>' +
    '<span class="gv">' + n + '</span></div>').join('');

  /* karşılama + haftalık kıyas + kayıt dönüşümü */
  const saat = new Date().getHours();
  const selam = saat < 6 ? 'İyi geceler' : saat < 12 ? 'Günaydın' : saat < 18 ? 'İyi günler' : 'İyi akşamlar';
  const emoji = saat < 6 ? '🌙' : saat < 12 ? '☀️' : saat < 18 ? '🌤️' : '🌆';
  const buHafta = haftaBasi(today), gecenHafta = gunEkle(buHafta, -7);
  const nBu = all.filter(x => x.iv.tarih >= buHafta && x.iv.tarih < gunEkle(buHafta, 7)).length;
  const nGecen = all.filter(x => x.iv.tarih >= gecenHafta && x.iv.tarih < buHafta).length;
  let kiyas = '';
  if (nGecen > 0) {
    const fark = Math.round((nBu - nGecen) / nGecen * 100);
    kiyas = fark > 0 ? '<span class="trend-up">↑ %' + fark + '</span>' : fark < 0 ? '<span class="trend-down">↓ %' + Math.abs(fark) + '</span>' : '<span class="trend-flat">aynı</span>';
  }
  const gorusulen = DB.students.filter(s => s.gorusmeler.length > 0);
  const kayitli = gorusulen.filter(s => s.kayitDurumu === 'Kayıt oldu').length;
  const donusum = gorusulen.length ? Math.round(kayitli / gorusulen.length * 100) : 0;
  const bekleyenKuyruk = DB.queue.filter(q => q.durum === 'Bekliyor').length;
  const bugunPlanli = DB.queue.filter(q => q.durum === 'Bekliyor' && q.planTarih && q.planTarih <= today).length;
  const temassiz = temassizListesi(30);

  const hedefDeger = parseInt(DB.settings.aylikHedef, 10) || 0;
  const sonGun2 = new Date(Number(UI.ay.slice(0, 4)), Number(UI.ay.slice(5)), 0).getDate();
  const kalanGun = UI.ay === today.slice(0, 7) ? sonGun2 - Number(today.slice(8)) : 0;
  let hedefHtml = '';
  if (UI.hedefEdit) {
    hedefHtml = '<form class="toolbar" data-action="hedef-kaydet" style="margin:12px 0 0">' +
      '<input type="number" name="deger" min="1" value="' + (hedefDeger || 150) + '" style="width:110px">' +
      '<button class="btn sm primary" type="submit">Hedefi Kaydet</button>' +
      '<button class="btn sm" type="button" data-action="hedef-vazgec">Vazgeç</button></form>';
  } else if (hedefDeger > 0) {
    const oranH = Math.min(100, Math.round(ayIv.length / hedefDeger * 100));
    hedefHtml = '<div style="margin-top:12px"><div class="gbar" style="grid-template-columns:1fr 60px">' +
      '<span class="track" style="height:20px"><span class="fill" style="width:' + oranH + '%"></span></span>' +
      '<span class="gv">%' + oranH + '</span></div>' +
      '<div class="small dim" style="margin-top:4px">Aylık hedef: <b>' + ayIv.length + ' / ' + hedefDeger + '</b> görüşme' +
      (kalanGun > 0 ? ' · ayın bitmesine ' + kalanGun + ' gün var' : '') +
      ' · <a data-action="hedef-duzenle">değiştir</a></div></div>';
  } else {
    hedefHtml = '<div class="small dim" style="margin-top:10px"><a data-action="hedef-duzenle">🎯 Aylık görüşme hedefi belirleyin</a> — ilerlemeniz burada çubukla görünsün</div>';
  }

  /* v34: ikinci hedef çubuğu — aylık NET ciro (iptal/iade/ödeme hatası hariç panel satışları) */
  const ciroHedefDeger = parseInt(DB.settings.ciroHedef, 10) || 0;
  const ayCiro = (DB.satislar || []).filter(r => satisGecerli(r) && (r.tarih || '').startsWith(UI.ay))
    .reduce((n, r) => n + (parseFloat(r.tutar) || 0), 0);
  let ciroHtml = '';
  if (UI.ciroEdit) {
    ciroHtml = '<form class="toolbar" data-action="ciro-kaydet" style="margin:10px 0 0">' +
      '<input type="number" name="deger" min="1" value="' + (ciroHedefDeger || 1000000) + '" style="width:150px"> ₺' +
      '<button class="btn sm primary" type="submit">Ciro Hedefini Kaydet</button>' +
      '<button class="btn sm" type="button" data-action="ciro-vazgec">Vazgeç</button></form>';
  } else if (ciroHedefDeger > 0) {
    const oranC = Math.min(100, Math.round(ayCiro / ciroHedefDeger * 100));
    ciroHtml = '<div style="margin-top:10px"><div class="gbar" style="grid-template-columns:1fr 60px">' +
      '<span class="track" style="height:20px"><span class="fill" style="width:' + oranC + '%"></span></span>' +
      '<span class="gv">%' + Math.round(ayCiro / ciroHedefDeger * 100) + '</span></div>' +
      '<div class="small dim" style="margin-top:4px">' + esc(ayAdi(UI.ay)) + ' net cirosu: <b>' + fmtTL(ayCiro) + ' / ' + fmtTL(ciroHedefDeger) + '</b>' +
      ' · <a data-goto="satis">Ders Alanlar</a>' + (ROL === 'admin' ? ' · <a data-action="ciro-duzenle">değiştir</a>' : '') + '</div></div>';
  } else if ((DB.satislar || []).length && ROL === 'admin') {
    ciroHtml = '<div class="small dim" style="margin-top:6px"><a data-action="ciro-duzenle">💰 Aylık ciro hedefi belirleyin</a> — net ciro burada ikinci çubukla görünsün</div>';
  }
  hedefHtml += ciroHtml;

  const acikBekleyen = DB.followups.filter(f => f.durum === 'Açık' || f.durum === 'Beklemede');
  const sozBugun = acikBekleyen.filter(f => f.hedefTarih === today);
  const sozGeciken = acikBekleyen.filter(f => f.hedefTarih && f.hedefTarih < today);
  const donusList = acikBekleyen.slice(0, 4).map(f =>
    '<div class="gbar pending-list-row" style="grid-template-columns:52px 170px 1fr">' +
    '<span class="dim small nowrap">' + esc(/^\d{4}-\d{2}-\d{2}/.test(f.acilis) ? f.acilis.slice(8, 10) + '.' + f.acilis.slice(5, 7) : f.acilis) + '</span><b class="small">' + esc(f.ogrenci) + '</b>' +
    '<span class="konu">' + esc(f.konu) + '</span></div>').join('');
  const sozKart = (sozBugun.length || sozGeciken.length) ?
    '<div class="card section card-pad due-card' + (sozGeciken.length ? ' late' : '') + '"><h2 class="card-title">⏰ Dönüş Sözleriniz</h2>' +
    sozBugun.map(f => '<div class="gbar" style="grid-template-columns:120px 1fr"><span class="chip warn">Bugün</span><span class="small"><b>' + esc(f.ogrenci) + '</b> — ' + esc(f.konu) + '</span></div>').join('') +
    sozGeciken.map(f => '<div class="gbar" style="grid-template-columns:120px 1fr"><span class="chip bad">' + fmtDate(f.hedefTarih) + '</span><span class="small"><b>' + esc(f.ogrenci) + '</b> — ' + esc(f.konu) + '</span></div>').join('') +
    '<div class="small" style="margin-top:8px"><a data-goto="takip">Takip Listesine git →</a></div></div>' : '';

  return sistemUyarilari() + '<div class="hello"><h1>' + selam + ' ' + esc(ADIM ? hitapAd(ADIM) + ' Hocam' : 'Hocam') + ' ' + emoji + '</h1>' +
    '<div class="chips">' +
    '<span>Bugün <b>' + bugun + ' görüşme</b> yaptınız</span>' +
    '<span>Bu hafta <b>' + nBu + '</b>' + (kiyas ? ' — geçen hafta ' + nGecen + ' (' + kiyas + ')' : '') + '</span>' +
    (bekleyenKuyruk ? '<span>📞 Aranacak <b>' + bekleyenKuyruk + ' kişi</b> var' + (bugunPlanli ? ' · bugün planlı <b>' + bugunPlanli + '</b>' : '') + '</span>' : '') +
    (temassiz.length ? '<span>🔕 <b>' + temassiz.length + ' ders alan</b> 30+ gündür temassız</span>' : '') +
    ((sozBugun.length + sozGeciken.length) ? '<span>⏰ <b>' + (sozBugun.length + sozGeciken.length) + ' dönüş sözü</b> sizi bekliyor</span>' : '') +
    (kayitli ? '<span>🎓 Kayda dönüşen: <b>' + kayitli + '</b> (%' + donusum + ')</span>' : '') +
    '</div>' + hedefHtml + '</div>' +
    '<div class="page-head"><div><h1 style="font-size:17px">Ana Sayfa</h1><div class="sub">' + fmtDate(today, true) + '</div></div>' +
    '<div class="head-actions"><button class="btn" data-goto="kuyruk">📞 Aranacaklar</button><button class="btn primary" data-goto="yeni">+ Yeni Görüşme</button></div></div>' +
    vCalismaListesi() + sozKart + vSinavKart() + vTemassizKart(temassiz) +
    (acikBekleyen.length ? '<div class="card section card-pad pending-list"><h2 class="card-title">Dönüş Bekleyenler (' + acikBekleyen.length + ')</h2>' +
      donusList + '<div class="small" style="margin-top:8px"><a data-goto="takip">Tümünü gör →</a></div></div>' : '') +
    '<div class="tiles section">' +
    '<div class="tile t-green"><div class="n">' + bugun + '</div><div class="l">Bugünkü görüşme</div></div>' +
    '<div class="tile t-sky"><div class="n">' + ayIv.length + '</div><div class="l">' + esc(ayAdi(UI.ay)) + ' görüşmesi</div></div>' +
    '<div class="tile"><div class="n">' + all.length + '</div><div class="l">Toplam görüşme</div></div>' +
    '<div class="tile t-lilac"><div class="n">' + DB.students.length + '</div><div class="l">Kayıtlı öğrenci</div></div>' +
    '<div class="tile t-amber"><div class="n">' + acik + '</div><div class="l">Açık takip</div></div>' +
    '</div>' +
    '<div class="card section card-pad"><h2 class="card-title">' + esc(ayAdi(UI.ay)) + ' — Günlük Görüşmeler</h2>' + chart + '</div>' +
    '<div class="card section"><div class="card-pad"><div class="toolbar" style="margin-bottom:8px">' +
    '<h2 class="card-title" style="margin:0">Ay Özeti</h2><span class="grow"></span>' +
    '<select data-action="ay-sec">' + months.map(m => '<option value="' + m + '"' + (m === UI.ay ? ' selected' : '') + '>' + esc(ayAdi(m)) + '</option>').join('') + '</select>' +
    '</div></div>' +
    '<div class="twrap"><table class="data"><thead><tr><th>Gün</th><th class="num">Görüşme</th><th class="num">İleri</th><th class="num">Pro</th><th class="num">Temel</th><th class="num">Yönlendirme</th><th class="num">Erişim S.</th><th class="num">Ek Görev</th><th>Durum</th></tr></thead>' +
    '<tbody>' + (rows || '<tr><td colspan="9" class="empty">Bu ay kayıt yok</td></tr>') + '</tbody></table></div></div>' +
    vKisiPanel() +
    '<div class="card section card-pad"><h2 class="card-title">Öğrenci Grupları</h2>' + gruplar + '</div>';
}

/* ---------- Öğrenciler ---------- */
function vStudents() {
  let list = DB.students.slice();
  if (UI.q) list = list.filter(st => matchStudent(st, UI.q));
  if (UI.grup) list = list.filter(st => st.grup === UI.grup);
  list.sort((a, b) => sonGorusme(b).localeCompare(sonGorusme(a)));
  const rows = list.map(st => {
    const son = sonGorusme(st);
    return '<tr class="rowlink" data-goto="ogrenci:' + esc(st.id) + '">' +
      '<td><div class="who"><span class="avatar ' + avatarClass(st.ad) + '">' + esc(initials(st.ad)) + '</span><b>' + esc(st.ad) + '</b>' + (st.kayitDurumu === 'Kayıt oldu' ? ' <span class="chip ok small">🎓</span>' : '') + '</div></td>' +
      '<td class="nowrap">' + esc(fmtPhone(st.tel)) + '</td>' +
      '<td>' + grpChip(st.grup) + '</td>' +
      '<td class="num">' + st.gorusmeler.length + '</td>' +
      '<td class="nowrap">' + (son ? fmtDate(son) : '<span class="dim">—</span>') + '</td>' +
      '<td class="nowrap small">' + esc([st.sonSinav, st.alinan].filter(Boolean).join(' · ')) + (st.hedef ? ' <span class="dim">/ hedef ' + esc(st.hedef) + '</span>' : '') + '</td></tr>';
  }).join('');
  return '<div class="page-head"><div><h1>Öğrenciler</h1><div class="sub">' + list.length + ' öğrenci listeleniyor · toplam ' + DB.students.length + '</div></div>' +
    '<div class="head-actions"><button class="btn" data-action="csv-tum">Tümünü indir (CSV)</button>' +
    '<button class="btn primary" data-goto="yeni">+ Yeni Görüşme</button></div></div>' +
    '<div class="toolbar"><input type="search" placeholder="Ad veya telefon ara…" value="' + esc(UI.q) + '" data-action="ara">' +
    '<select data-action="grup-sec"><option value="">Tüm gruplar</option>' +
    DB.catalogs.gruplar.map(g => '<option' + (UI.grup === g ? ' selected' : '') + '>' + esc(g) + '</option>').join('') + '</select></div>' +
    '<div class="card"><div class="twrap"><table class="data"><thead><tr><th>Öğrenci</th><th>Telefon</th><th>Grup</th><th class="num">Görüşme</th><th>Son Görüşme</th><th>Son Sınav / Puan</th></tr></thead>' +
    '<tbody>' + (rows || '<tr><td colspan="6" class="empty">Eşleşen öğrenci yok</td></tr>') + '</tbody></table></div></div>';
}

/* ---------- Öğrenci profili ---------- */
function ivCard(iv) {
  const facts = [
    ['Arama', iv.deneme], ['Son sınav', iv.sinav], ['Alınan', iv.alinan], ['Hedef', iv.hedef],
    ['Yakın sınav', iv.yakinSinav], ['Puanı yeterli', iv.puanYeterli], ['Devam ediyor', iv.devamEdiyor],
    ['Kursu tamamladı', iv.kursuTamamladi], ['Yönlendirme', iv.yonlendirme], ['Yeni program', iv.baskaProgram],
    ['Erişim sorunu', iv.erisimSorunu], ['Ana program', iv.anaProgram], ['Ek ders', iv.ekDers],
    ['Düşündüğü program', iv.dusunulenProgram]
  ].filter(f => f[1]);
  const notes = [['Görüşme notu', iv.gorusmeNotu], ['Önerilen', iv.onerilen], ['Yapılan işlem', iv.islem]].filter(n => n[1]);
  return '<div class="iv-card"><div class="iv-head">' +
    '<b>' + fmtDate(iv.tarih, true) + (iv.saat ? ' · ' + esc(iv.saat) : '') + '</b>' +
    grpChip(iv.grup) +
    '<span class="chip src">' + esc(SRC_AD[iv.kaynak] || iv.kaynak) + '</span>' +
    kimChip(iv.gorusen) +
    (iv.id ? rowActions('iv', iv.id) : '') +
    '</div><div class="iv-body">' +
    (facts.length ? '<div class="iv-facts">' + facts.map(f => '<span>' + esc(f[0]) + ': <b>' + esc(f[1]) + '</b></span>').join('') + '</div>' : '') +
    notes.map(n => '<p class="iv-note"><span class="k">' + esc(n[0]) + '</span>' + esc(n[1]) + '</p>').join('') +
    (!facts.length && !notes.length ? '<span class="dim small">Detay girilmemiş</span>' : '') +
    '</div></div>';
}
function vStudent(id) {
  const st = stById(id);
  if (!st) return '<div class="empty">Öğrenci bulunamadı. <a data-goto="ogrenciler">Listeye dön</a></div>';
  const ivs = [...st.gorusmeler].sort((a, b) => ((b.tarih || '') + (b.saat || '')).localeCompare((a.tarih || '') + (a.saat || '')));
  const takipler = DB.followups.filter(f => (st.tel && f.tel === st.tel) || f.ogrenci.toLocaleLowerCase('tr') === st.ad.toLocaleLowerCase('tr'));
  const tabs = [['gorusmeler', 'Görüşmeler (' + ivs.length + ')'], ['takipler', 'Takipler (' + takipler.length + ')'], ['bilgiler', 'Bilgileri Düzenle']];
  if (!tabs.some(t => t[0] === UI.tab)) UI.tab = 'gorusmeler';

  let body = '';
  if (UI.tab === 'gorusmeler') {
    body = ivs.length ? ivs.map(iv => ivCard(iv)).join('') : '<div class="card empty">Henüz görüşme kaydı yok</div>';
  } else if (UI.tab === 'takipler') {
    body = takipler.length ? '<div class="card"><div class="twrap"><table class="data"><thead><tr><th>Açılış</th><th>Konu</th><th>Sorumlu</th><th>Durum</th></tr></thead><tbody>' +
      takipler.map(f => '<tr><td class="nowrap">' + esc(fmtDate(f.acilis)) + '</td><td>' + esc(f.konu) + (f.not ? '<div class="dim small">' + esc(f.not) + '</div>' : '') + '</td><td>' + esc(kimAd(f.sorumlu)) + '</td><td>' + durumChip(f.durum) + '</td></tr>').join('') +
      '</tbody></table></div></div>' : '<div class="card empty">Bu öğrenci için takip kaydı yok</div>';
  } else {
    body = '<div class="card card-pad"><form data-action="ogrenci-kaydet" data-id="' + esc(st.id) + '"><div class="fgrid">' +
      '<div class="field"><label>Ad Soyad</label><input name="ad" required value="' + esc(st.ad) + '"></div>' +
      '<div class="field"><label>Telefon</label><input name="tel" value="' + esc(st.tel) + '" inputmode="tel"></div>' +
      '<div class="field"><label>Grup</label><select name="grup"><option value="">—</option>' +
      DB.catalogs.gruplar.map(g => '<option' + (st.grup === g ? ' selected' : '') + '>' + esc(g) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label>Hedef Puan</label><input name="hedef" value="' + esc(st.hedef) + '"></div>' +
      '<div class="field wide"><label>Program(lar) — her satıra bir tane</label><textarea name="programlar" rows="2">' + esc(st.programlar.join('\n')) + '</textarea></div>' +
      '<div class="field wide"><label>Son Görüşme Sonucu</label><textarea name="sonSonuc" rows="2">' + esc(st.sonSonuc) + '</textarea></div>' +
      '</div><div class="form-actions"><button class="btn primary" type="submit">Kaydet</button></div></form></div>';
  }

  /* puan gelişim grafiği */
  const noktalar = ivs.slice().reverse()
    .map(iv => ({ t: iv.tarih, v: sayi(iv.alinan), s: iv.sinav }))
    .filter(p => p.v != null && p.t);
  let puanChart = '';
  if (noktalar.length >= 2) {
    const W = 560, H = 132, pL = 34, pR = 20, pT = 20, pB = 24;
    const vs = noktalar.map(p => p.v);
    const min = Math.min(...vs), max = Math.max(...vs);
    const span = (max - min) || 1;
    const px = i => (pL + i * (W - pL - pR) / (noktalar.length - 1)).toFixed(1);
    const py = v => (pT + (max - v) / span * (H - pT - pB)).toFixed(1);
    const cizgi = noktalar.map((p, i) => px(i) + ',' + py(p.v)).join(' ');
    const dots = noktalar.map((p, i) =>
      '<circle class="dot-ring" cx="' + px(i) + '" cy="' + py(p.v) + '" r="6"></circle>' +
      '<circle class="dot" cx="' + px(i) + '" cy="' + py(p.v) + '" r="4"><title>' + fmtDate(p.t) + (p.s ? ' · ' + esc(p.s) : '') + ' — ' + p.v + '</title></circle>').join('');
    const ilkP = noktalar[0], sonP = noktalar[noktalar.length - 1];
    const yon = sonP.v > ilkP.v ? '<span class="trend-up">↑ +' + Math.round((sonP.v - ilkP.v) * 100) / 100 + ' puan</span>' :
      sonP.v < ilkP.v ? '<span class="trend-down">↓ ' + Math.round((ilkP.v - sonP.v) * 100) / 100 + ' puan</span>' : '<span class="trend-flat">değişim yok</span>';
    puanChart = '<div class="card section card-pad score-chart"><h2 class="card-title">Puan Gelişimi — ' + yon + '</h2>' +
      '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Sınav puanı gelişimi">' +
      '<line class="grid" x1="' + pL + '" y1="' + py(min) + '" x2="' + (W - pR) + '" y2="' + py(min) + '"/>' +
      '<text x="' + (pL - 6) + '" y="' + (Number(py(max)) + 4) + '" text-anchor="end">' + max + '</text>' +
      '<text x="' + (pL - 6) + '" y="' + (Number(py(min)) + 4) + '" text-anchor="end">' + min + '</text>' +
      '<polyline class="line" points="' + cizgi + '"/>' + dots +
      '<text class="val" x="' + px(0) + '" y="' + (Number(py(ilkP.v)) - 10) + '" text-anchor="middle">' + ilkP.v + '</text>' +
      '<text class="val" x="' + px(noktalar.length - 1) + '" y="' + (Number(py(sonP.v)) - 10) + '" text-anchor="middle">' + sonP.v + '</text>' +
      '<text x="' + pL + '" y="' + (H - 6) + '" text-anchor="start">' + fmtDate(ilkP.t) + '</text>' +
      '<text x="' + px(noktalar.length - 1) + '" y="' + (H - 6) + '" text-anchor="end">' + fmtDate(sonP.t) + '</text>' +
      '</svg></div>';
  }

  /* mesaj paneli */
  const msgPanel = UI.msgOpen ?
    '<div class="card section card-pad"><h2 class="card-title">💬 Hazır Mesaj Gönder — tıklayınca ' + esc(ilkAd(st.ad)) + ' adına uyarlanıp kopyalanır</h2>' +
    (DB.templates.length ? '<div class="msg-list">' + DB.templates.map(t =>
      '<div class="msg-row"><b class="small">' + esc(t.ad) + '</b><span class="nowrap"><button class="btn sm" data-action="msg-kopyala" data-id="' + esc(t.id) + '" data-sid="' + esc(st.id) + '">📋 Kopyala</button> ' +
