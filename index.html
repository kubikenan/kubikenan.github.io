/* ---------- Aranacaklar Kuyruğu ---------- */
function vQueue() {
  const bugun = todayISO();
  const bekleyenTum = DB.queue.filter(q => q.durum === 'Bekliyor');
  /* sıra: öncelikli → planı bugün/geçmiş → planı ileride → plansız; eşitlikte plan tarihi, sonra eklenme */
  const sira = q => (q.oncelik === '1' ? 0 : 10) + (q.planTarih ? (q.planTarih <= bugun ? 0 : 1) : 2);
  let bekleyen = bekleyenTum.slice().sort((a, b) => sira(a) - sira(b) || (a.planTarih || '9').localeCompare(b.planTarih || '9') || tarihTam(a.eklenme).localeCompare(tarihTam(b.eklenme)));
  const nBugun = bekleyenTum.filter(q => q.planTarih && q.planTarih <= bugun).length;
  const nOncelik = bekleyenTum.filter(q => q.oncelik === '1').length;
  const f = UI.kuyrukF || '';
  const kuyrukYas = q => { const e = isoGun(q.eklenme, 7); const g = e ? gunFarki(e) : null; return g === null ? 0 : g; }; /* v34.1: '04.09.2026 12:34' biçimi de okunur */
  if (f === 'bugun') bekleyen = bekleyen.filter(q => q.planTarih && q.planTarih <= bugun);
  else if (f === 'oncelik') bekleyen = bekleyen.filter(q => q.oncelik === '1');
  else if (f === 'plansiz') bekleyen = bekleyen.filter(q => !q.planTarih);
  else if (f === 'bayat') bekleyen = bekleyen.filter(q => kuyrukYas(q) >= 15); /* v34 */
  const aranan = DB.queue.filter(q => q.durum === 'Arandı').slice(-10).reverse();
  const yarin = gunEkle(bugun, 1);
  const alSet = satisAliciSeti(); /* v33: kuyrukta bekleyen ama satın almış kişiye rozet */
  const rows = bekleyen.map(q => {
    const eklendi = isoGun(q.eklenme, 7); /* v34.1: AGS formundan gelen '04.09.2026 12:34' biçimi de okunur */
    const eski = eklendi && eklendi < bugun;
    const onc = q.oncelik === '1';
    const plan = !q.planTarih ? '<span class="dim small">plansız</span>' :
      q.planTarih < bugun ? '<span class="chip bad">' + fmtDate(q.planTarih) + ' planlıydı</span>' :
      q.planTarih === bugun ? '<span class="chip warn">Bugün</span>' : '<span class="chip src">' + fmtDate(q.planTarih, true) + '</span>';
    return '<tr' + (onc ? ' class="oncelikli"' : '') + '><td><div class="who"><span class="avatar ' + avatarClass(q.ad) + '">' + esc(initials(q.ad)) + '</span>' +
      (q.ogrenciId ? '<a data-goto="ogrenci:' + esc(q.ogrenciId) + '"><b>' + esc(q.ad) + '</b></a>' : '<b>' + esc(q.ad) + '</b>') +
      (aliciMi(alSet, q.tel, q.ad, q.ogrenciId) === 2 ? ' <span class="chip ok" title="Geçerli satışı var — arama önceliği düşebilir">🛒</span>' :
        aliciMi(alSet, q.tel, q.ad, q.ogrenciId) === 1 ? ' <span class="chip warn" title="Yalnız ad benzerliği — doğrulayın">🛒?</span>' : '') + '</div></td>' +
      '<td class="nowrap">' + esc(fmtPhone(q.tel)) + ' ' + waChip(q.tel, '', '💬') + '</td>' +
      '<td class="nowrap">' + (eski ? '<span class="dim small">' + fmtDate(eklendi) + ' tarihinden beri</span>' : '<span class="dim small">bugün eklendi</span>') + '</td>' +
      '<td class="nowrap"><div class="plan-cell">' + plan +
      '<button class="btn sm" data-action="kuyruk-plan" data-id="' + esc(q.id) + '" data-t="' + bugun + '"' + (q.planTarih === bugun ? ' disabled' : '') + '>Bugün</button>' +
      '<button class="btn sm" data-action="kuyruk-plan" data-id="' + esc(q.id) + '" data-t="' + yarin + '"' + (q.planTarih === yarin ? ' disabled' : '') + '>Yarın</button>' +
      '<input type="date" data-action="kuyruk-plan-tarih" data-id="' + esc(q.id) + '" value="' + esc(q.planTarih || '') + '" title="Arama günü seç">' +
      (q.planTarih ? '<button class="icon-btn" title="Planı kaldır" data-action="kuyruk-plan" data-id="' + esc(q.id) + '" data-t="">×</button>' : '') + '</div></td>' +
      '<td class="nowrap"><button class="icon-btn star' + (onc ? ' on' : '') + '" title="' + (onc ? 'Önceliği kaldır' : 'Öncelikli işaretle') + '" data-action="kuyruk-oncelik" data-id="' + esc(q.id) + '" data-v="' + (onc ? '' : '1') + '">' + (onc ? '★' : '☆') + '</button></td>' +
      '<td class="nowrap"><button class="btn sm primary" data-action="kuyruk-arandi" data-id="' + esc(q.id) + '" data-sid="' + esc(q.ogrenciId || '') + '">✓ Aradım → Görüşme Gir</button> ' +
      '<span class="del-zone"><button class="icon-btn danger" title="Kuyruktan çıkar" data-action="del" data-kind="queue" data-id="' + esc(q.id) + '">' + ICONS.trash + '</button></span></td></tr>';
  }).join('');
  const arananRows = aranan.map(q => '<tr class="dim"><td>' + esc(q.ad) + '</td><td class="nowrap">' + esc(fmtPhone(q.tel)) + '</td>' +
    '<td><span class="chip ok">Arandı</span></td><td class="nowrap"><span class="del-zone"><button class="icon-btn" title="Sil" data-action="del" data-kind="queue" data-id="' + esc(q.id) + '">' + ICONS.trash + '</button></span></td></tr>').join('');
  const nPlansiz = bekleyenTum.filter(q => !q.planTarih).length;
  const nBayat = bekleyenTum.filter(q => kuyrukYas(q) >= 15).length;
  const filtreler = [['', 'Tümü (' + bekleyenTum.length + ')'], ['bugun', 'Bugün aranacak (' + nBugun + ')'], ['oncelik', '★ Öncelikli (' + nOncelik + ')'], ['plansiz', 'Plansız (' + nPlansiz + ')'], ['bayat', '🕰 15+ gün (' + nBayat + ')']];
  /* v34: toplu planlama sihirbazı — plansız (veya tüm bekleyen) kayıtları günlük kapasiteyle ileri günlere dağıtır */
  const sihirbazHtml = UI.kuyrukSihir && ROL === 'admin' ?
    '<div class="card card-pad section"><h2 class="card-title">🪄 Toplu Planla</h2>' +
    '<div class="small dim" style="margin-bottom:8px">Sıralama: önce ★ öncelikliler, sonra en uzun süredir bekleyenler. Pazar günleri atlanır; dünde kalan planları gece nöbetçisi ertesi sabaha çeker.</div>' +
    '<form data-action="kuyruk-planla"><div class="fgrid">' +
    '<div class="field"><label>Kapsam</label><select name="kapsam">' +
    '<option value="plansiz">Yalnız plansızlar (' + nPlansiz + ' kişi)</option>' +
    '<option value="hepsi">Tüm bekleyenler (' + bekleyenTum.length + ' kişi — mevcut planlar üzerine yazılır)</option></select></div>' +
    '<div class="field"><label>Günlük arama kapasitesi</label><input type="number" name="kapasite" min="1" max="60" value="20"></div>' +
    '<div class="field"><label>Başlangıç günü</label><input type="date" name="baslangic" value="' + bugun + '"></div>' +
    '</div><div class="form-actions"><button class="btn primary" type="submit">Planı Dağıt</button>' +
    '<button class="btn" type="button" data-action="kuyruk-sihir-kapat">Vazgeç</button></div></form></div>' : '';
  return '<div class="page-head"><div><h1>Aranacaklar</h1><div class="sub">' + bekleyenTum.length + ' kişi sırada' + (nBugun ? ' · <b>bugün ' + nBugun + ' arama planlı</b>' : '') + (nOncelik ? ' · ' + nOncelik + ' öncelikli' : '') + ' — gün atayın, yıldızlayın, aradıkça işaretleyin</div></div>' +
    '<div class="head-actions">' + (ROL === 'admin' && !UI.kuyrukSihir ? '<button class="btn" data-action="kuyruk-sihir-ac">🪄 Toplu Planla</button>' : '') + '</div></div>' +
    sihirbazHtml +
    '<div class="card card-pad section"><div class="field ac-box" style="max-width:480px">' +
    '<label>Kuyruğa öğrenci ekle (ad / telefon yazın)</label>' +
    '<input autocomplete="off" placeholder="Ad Soyad yazın…" data-action="kac" id="kac-input"><div class="ac-list" id="kac-list" hidden></div></div></div>' +
    '<div class="tabs">' + filtreler.map(x => '<button class="tab' + (f === x[0] ? ' active' : '') + '" data-action="kuyruk-filtre" data-f="' + x[0] + '">' + esc(x[1]) + '</button>').join('') + '</div>' +
    '<div class="card section"><div class="twrap"><table class="data"><thead><tr><th>Öğrenci</th><th>Telefon</th><th>Eklenme</th><th>Arama günü</th><th title="Öncelik">★</th><th></th></tr></thead>' +
    '<tbody>' + (rows || '<tr><td colspan="6" class="empty">' + (f ? 'Bu filtrede kimse yok' : 'Kuyruk boş — yukarıdan öğrenci ekleyin 📞') + '</td></tr>') + '</tbody></table></div></div>' +
    (arananRows ? '<div class="card section"><div class="card-pad"><h2 class="card-title">Son Arananlar</h2></div><div class="twrap"><table class="data"><tbody>' + arananRows + '</tbody></table></div></div>' : '');
}

/* ---------- Haftalık Özet ---------- */
function haftaVerisi(pazartesi) {
  const bitis = gunEkle(pazartesi, 7);
  return allInterviews().filter(x => x.iv.tarih >= pazartesi && x.iv.tarih < bitis);
}
function vWeekly(arg) {
  const dates = datesWithData();
  let hafta = arg || UI.hafta || haftaBasi(dates[dates.length - 1] || todayISO());
  UI.hafta = hafta;
  const list = haftaVerisi(hafta);
  const s = dayStats(list);
  const onceki = haftaVerisi(gunEkle(hafta, -7));
  let kiyas = '';
  if (onceki.length > 0) {
    const fark = Math.round((list.length - onceki.length) / onceki.length * 100);
    kiyas = fark > 0 ? '<span class="trend-up">↑ %' + fark + '</span>' : fark < 0 ? '<span class="trend-down">↓ %' + Math.abs(fark) + '</span>' : '<span class="trend-flat">aynı</span>';
  }
  const gunAdlari = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi', 'Pazar'];
  const gunRows = [];
  for (let g = 0; g < 7; g++) {
    const tarih = gunEkle(hafta, g);
    const gl = byDate(tarih);
    const nTask = DB.tasks.filter(t => t.tarih === tarih).length;
    if (g >= 5 && !gl.length && !nTask) continue;
    const gs = dayStats(gl);
    gunRows.push('<tr class="rowlink" data-goto="rapor:' + tarih + '"><td class="nowrap">' + gunAdlari[g] + ' <span class="dim small">' + fmtDate(tarih) + '</span></td>' +
      '<td class="num">' + gs.toplam + '</td><td class="num">' + gs.ileri + '</td><td class="num">' + gs.pro + '</td>' +
      '<td class="num">' + gs.yonl + '</td><td class="num">' + gs.erisim + '</td><td class="num">' + nTask + '</td></tr>');
  }
  const gunSayisi = new Set(list.map(x => x.iv.tarih)).size;
  return '<div class="page-head"><div><h1>Haftalık Özet</h1><div class="sub">Ümit Hoca ve Tijen Hoca\'ya haftalık sunum için</div></div>' +
    '<div class="head-actions"><button class="btn" data-action="hafta-kopyala"' + (list.length ? '' : ' disabled') + '>Haftalık Özeti Kopyala</button></div></div>' +
    '<div class="toolbar">' +
    '<button class="btn sm" data-action="hafta-git" data-d="' + gunEkle(hafta, -7) + '">‹ Önceki Hafta</button>' +
    '<b>' + fmtDate(hafta) + ' – ' + fmtDate(gunEkle(hafta, 6)) + '</b>' +
    '<button class="btn sm" data-action="hafta-git" data-d="' + gunEkle(hafta, 7) + '"' + (gunEkle(hafta, 7) > todayISO() ? ' disabled' : '') + '>Sonraki Hafta ›</button></div>' +
    '<div class="tiles section">' +
    '<div class="tile t-green"><div class="n">' + list.length + '</div><div class="l">Haftalık görüşme</div></div>' +
    '<div class="tile"><div class="n">' + (gunSayisi ? Math.round(list.length / gunSayisi) : 0) + '</div><div class="l">Günlük ortalama</div></div>' +
    '<div class="tile t-sky"><div class="n">' + s.ileri + '</div><div class="l">İleri Seviye</div></div>' +
    '<div class="tile t-amber"><div class="n">' + s.pro + '</div><div class="l">Pro Grup</div></div>' +
    '<div class="tile t-lilac"><div class="n">' + s.yonl + '</div><div class="l">Yönlendirme</div></div>' +
    '<div class="tile t-red"><div class="n">' + s.erisim + '</div><div class="l">Erişim sorunu</div></div>' +
    '</div>' +
    (kiyas ? '<div class="banner info section">Önceki haftaya göre: bu hafta ' + list.length + ', geçen hafta ' + onceki.length + ' görüşme (' + kiyas + ')</div>' : '') +
    '<div class="card section"><div class="twrap"><table class="data"><thead><tr><th>Gün</th><th class="num">Görüşme</th><th class="num">İleri</th><th class="num">Pro</th><th class="num">Yönlendirme</th><th class="num">Erişim</th><th class="num">Görev</th></tr></thead>' +
    '<tbody>' + (gunRows.join('') || '<tr><td colspan="7" class="empty">Bu haftada kayıt yok</td></tr>') + '</tbody></table></div></div>';
}
function haftaOzetText(hafta) {
  const list = haftaVerisi(hafta);
  const s = dayStats(list);
  const gunAdlari = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi', 'Pazar'];
  const L = [];
  L.push('📊 HAFTALIK ÖZET — ' + fmtDate(hafta) + ' – ' + fmtDate(gunEkle(hafta, 6)));
  L.push('Hazırlayan: ' + (ADIM || 'Kubilay Kenan Hoca'));
  L.push('');
  L.push('Toplam Görüşme: ' + s.toplam + ' | İleri Seviye: ' + s.ileri + ' | Pro Grup: ' + s.pro);
  L.push('Yönlendirme İsteyen: ' + s.yonl + ' | Yeni Program Düşünen: ' + s.yeniProg + ' | Erişim Sorunu: ' + s.erisim);
  L.push('');
  L.push('— GÜN GÜN —');
  for (let g = 0; g < 7; g++) {
    const tarih = gunEkle(hafta, g);
    const n = byDate(tarih).length;
    if (g >= 5 && !n) continue;
    L.push('• ' + gunAdlari[g] + ' (' + fmtDate(tarih) + '): ' + (n ? n + ' görüşme' : '—'));
  }
  const acik = DB.followups.filter(f => f.durum === 'Açık').length;
  if (acik) { L.push(''); L.push('Açık takip işi: ' + acik); }
  return L.join('\n');
}

/* ---------- Ders Alanlar (yönetim paneli satışları × görüşme/yazışma temasları) ---------- */
const SATIS_RED = ['İptal edildi', 'Ödeme hatası', 'Ücret İade Edildi', 'PayTR Ödemesi Bekleniyor'];
const TEMAS_AD = { site: 'Görüşme', wa: 'WhatsApp', tg: 'Telegram', ags: 'AGS Formu' };
const KONUM_AD = { sonra: 'Görüşme sonrası', once: 'Görüşme öncesi', 'temas-disi': 'Görüşme kaydı yok' };
function satisGecerli(r) { return SATIS_RED.indexOf(String(r.durum || '')) < 0; }
/* v33: geçerli satışı olan kişilerin anahtar kümesi — takip/kuyrukta "🛒 satın aldı" rozeti için */
function satisAliciSeti() {
  /* v34.1: anahtar → kişinin EN SON geçerli satış tarihi (takip açılışıyla kıyaslamak için) */
  const s = new Map();
  const ekle = (k, t) => { if (!s.has(k) || t > s.get(k)) s.set(k, t); };
  (DB.satislar || []).forEach(r => {
    if (!satisGecerli(r)) return;
    const t = String(r.tarih || '').slice(0, 10);
    if (r.ogrenciId) ekle('i' + r.ogrenciId, t);
    const tel = normTel(r.tel); if (tel) ekle('t' + tel, t);
    const a = adKey(r.ad); if (a) ekle('a' + a, t);
  });
  return s;
}
/* eşleşme SEVİYESİ döner: 2 = ogrenciId/telefon (güvenli), 1 = yalnız ad benzerliği (temkinli), 0 = yok.
   Tek tık "Kapat" yalnız seviye 2'de gösterilir — aynı adlı başka biri yüzünden yanlış kapatma olmasın. */
/* v34.1: esik (takibin açılış tarihi) verilirse ve kişinin son geçerli satışı bu tarihten ÖNCEYSE 3 döner:
   "müşteri" — takip satın almadan SONRA açılmış bir destek işidir, satışla kapanmaz (Kapat düğmesi yok). */
function aliciMi(set, tel, ad, ogrenciId, esik) {
  let son = '', bulundu = false;
  const bak = k => { if (set.has(k)) { bulundu = true; const v = set.get(k) || ''; if (v > son) son = v; } };
  if (ogrenciId) bak('i' + ogrenciId);
  const t = normTel(tel); if (t) bak('t' + t);
  if (bulundu) return esik && son && son < String(esik).slice(0, 10) ? 3 : 2;
  const a = adKey(ad); return (a && set.has('a' + a)) ? 1 : 0;
}
function fmtTL(n) {
  const v = Math.round(parseFloat(n) || 0);
  return v.toLocaleString('tr-TR') + ' ₺';
}
function temasChips(t) {
  return String(t || '').split('/').filter(Boolean)
    .map(k => '<span class="chip src">' + esc(TEMAS_AD[k] || k) + '</span>').join(' ');
}
function konumChip(k) {
  const cls = k === 'sonra' ? 'ok' : (k === 'once' ? 'src' : 'warn');
  return '<span class="chip ' + cls + '">' + esc(KONUM_AD[k] || k || '—') + '</span>';
}
/* Satislar satırlarını kişiye (panel kullanıcısı) göre toplar */
function satisKisiler() {
  if (!DB || !DB.satislar) return [];
  const m = new Map();
  DB.satislar.forEach(r => {
    const k = r.uid || r.siparisId;
    if (!m.has(k)) {
      m.set(k, {
        uid: k, ad: r.ad || '', tel: r.tel || '', grup: r.grup || '', temas: r.temas || '',
        eslesme: r.eslesme || '', ogrenciId: r.ogrenciId || '', agsId: r.agsId || '',
        ilkGorusme: r.ilkGorusme || '', sonGorusme: r.sonGorusme || '', konum: '',
        satirlar: [], gecerliTutar: 0, gecerliAdet: 0, redAdet: 0, redTutar: 0,
        sonTarih: '', kurs: false, isaret: '', not: ''
      });
    }
    const o = m.get(k);
    o.satirlar.push(r);
    if (!o.ogrenciId && r.ogrenciId) o.ogrenciId = r.ogrenciId;
    if (!o.agsId && r.agsId) o.agsId = r.agsId;
    if (!o.grup && r.grup) o.grup = r.grup;
    if (!o.ilkGorusme && r.ilkGorusme) o.ilkGorusme = r.ilkGorusme;
    if (r.isaret) o.isaret = r.isaret;
    if (r.not) o.not = r.not;
    if (satisGecerli(r)) {
      o.gecerliAdet++;
      o.gecerliTutar += parseFloat(r.tutar) || 0;
      if ((r.tarih || '') > o.sonTarih) o.sonTarih = r.tarih || '';
      if (r.tip === 'kurs') o.kurs = true;
      /* kişinin konumu: bir alım bile görüşmeden sonraysa dönüşüm sayılır */
      if (r.konum === 'sonra' || !o.konum) o.konum = r.konum || '';
    } else {
      o.redAdet++;
      o.redTutar += parseFloat(r.tutar) || 0;
    }
  });
  return Array.from(m.values());
}
function satisFiltre(kisiler) {
  let list = kisiler;
  if (UI.sq) {
    const q = aramaKatla(UI.sq), dig = UI.sq.replace(/\D/g, '');
    list = list.filter(k => (q && aramaKatla(k.ad).includes(q)) || (dig.length >= 3 && (k.tel || '').includes(dig)));
  }
  if (UI.stemas) list = list.filter(k => k.temas.split('/').indexOf(UI.stemas) >= 0);
  if (UI.skonum) list = list.filter(k => k.konum === UI.skonum);
  if (UI.sgrup) list = list.filter(k => (k.grup || '') === UI.sgrup);
  if (UI.stip === 'kurs') list = list.filter(k => k.kurs);
  else if (UI.stip === 'kartyok') list = list.filter(k => !k.ogrenciId);
  else if (UI.stip === 'kacan') list = list.filter(k => k.redAdet > 0 && !k.gecerliAdet);
  if (!UI.sred && UI.stip !== 'kacan') list = list.filter(k => k.gecerliAdet > 0);
  return list.sort((a, b) => (b.sonTarih || '').localeCompare(a.sonTarih || '') || b.gecerliTutar - a.gecerliTutar);
}
/* v34: aylara göre NET ciro (geçerli siparişler) + iptal/hata kaybı — Ay Özeti'nin satış ayağı */
function vSatisAylik() {
  const rows = DB.satislar || [];
  const aylarMap = {};
  rows.forEach(r => {
    const ay = String(r.tarih || '').slice(0, 7);
    if (!/^\d{4}-\d{2}$/.test(ay)) return;
    if (!aylarMap[ay]) aylarMap[ay] = { net: 0, adet: 0, red: 0, redAdet: 0 };
    if (satisGecerli(r)) { aylarMap[ay].net += parseFloat(r.tutar) || 0; aylarMap[ay].adet++; }
    else { aylarMap[ay].red += parseFloat(r.tutar) || 0; aylarMap[ay].redAdet++; }
  });
  const aylar = Object.keys(aylarMap).sort().reverse();
  if (!aylar.length) return '';
  const ayAdi = m => AYLAR[Number(m.slice(5)) - 1] + ' ' + m.slice(0, 4);
  const hedef = parseInt(DB.settings.ciroHedef, 10) || 0;
  const satirlar = aylar.map(m => {

      '<td class="num">' + v.adet + '</td><td class="num"><b>' + fmtTL(v.net) + '</b></td>' +

      (hedef ? '<td class="num">' + (m === todayISO().slice(0, 7) || v.net ? '%' + Math.round(v.net / hedef * 100) : '—') + '</td>' : '') + '</tr>';
  }).join('');
  return '<div class="card section"><div class="card-pad"><h2 class="card-title" style="margin:0">Aylara Göre Net Ciro</h2></div>' +
    '<div class="twrap"><table class="data"><thead><tr><th>Ay</th><th class="num">Geçerli sipariş</th><th class="num">Net ciro</th><th class="num">İptal / hata</th>' +
    (hedef ? '<th class="num">Hedefe oran</th>' : '') + '</tr></thead><tbody>' + satirlar + '</tbody></table></div>' +
    '<div class="card-pad small dim">Net ciro yalnız geçerli siparişleri toplar; iptal, ödeme hatası ve iade edilen tutarlar yanında ayrı gösterilir.' +
    (hedef ? ' Aylık hedef: <b>' + fmtTL(hedef) + '</b> (Ana Sayfa\'dan değiştirilir).' : '') + '</div></div>';
}

  }

  const months = [...new Set(all.map(x => (x.iv.tarih || '').slice(0, 7)).filter(Boolean))].sort().reverse();
  const ayAdi = m => AYLAR[Number(m.slice(5)) - 1] + ' ' + m.slice(0, 4);

  const s = dayStats(list);

function selectOpts(list, val, freeExtra) {
  const opts = ['<option value="">—</option>'];
  const items = [...list];
  if (freeExtra && val && !items.includes(val)) items.push(val);
  items.forEach(o => opts.push('<option' + (o === val ? ' selected' : '') + '>' + esc(o) + '</option>'));
  return opts.join('');
}

/* bu turda yapılmış son görüşme (site kaydı) */
function arSonGorusme(k) {

  if (!st || !st.gorusmeler || !st.gorusmeler.length) return null;
  const tur = st.gorusmeler.filter(g => (g.tarih || '') >= AR_BAS);
  if (!tur.length) return null;
  return tur.slice().sort((a, b) => ((a.tarih || '') + (a.saat || '')).localeCompare((b.tarih || '') + (b.saat || '')))[tur.length - 1];
}
function arDurumGecer(k) {

function arKaydettikten(id) {
  /* görüşme kaydedildi: kişi 'bu turda aranmamış' süzgecinden düşer, sıradakine geçilir */
  const k = arKisi(id);
  const l = arListe().filter(x => x.id !== id);
  UI.arSec = l.length ? l[0].id : null;
  go('arama');
  if (k) toast(k.ad + ' kaydedildi ✓ · kalan ' + l.length + ' kişi');
}
function arSonraki() {
  const l = arListe();
  if (!l.length) { UI.arSec = null; render(); return; }
  const i = l.findIndex(x => x.id === UI.arSec);
  UI.arSec = l[(i + 1) % l.length].id;
  render();
  const v = document.getElementById('view'); if (v) v.scrollIntoView({ block: 'start' });
}

function vReport(dateArg) {
  const dates = datesWithData();
  let date = dateArg || UI.raporDate || dates[dates.length - 1] || todayISO();
  UI.raporDate = date;
  const list = byDate(date);
  const s = dayStats(list);
  const tasks = DB.tasks.filter(t => t.tarih === date);
  const note = DB.dailyNotes[date] || '';
  const di = dates.indexOf(date);
  const prev = di > 0 ? dates[di - 1] : (dates.length && di === -1 ? dates[dates.length - 1] : '');
  const next = di >= 0 && di < dates.length - 1 ? dates[di + 1] : '';

  const tiles = [
    ['Toplam Görüşme', s.toplam, 't-green'], ['İleri Seviye', s.ileri, ''], ['Pro Grup', s.pro, 't-amber'], ['Temel Seviye', s.temel, 't-sky'],
    ['Yönlendirme İsteyen', s.yonl, 't-lilac'], ['Yeni Program Düşünen', s.yeniProg, ''], ['Erişim Sorunu', s.erisim, 't-red'], ['Puanı Yeterli', s.yeterli, 't-green']
  ].map(t => '<div class="tile ' + t[2] + '"><div class="n">' + t[1] + '</div><div class="l">' + t[0] + '</div></div>').join('');

  const rows = list.map(x => {
    const iv = x.iv;
    return '<tr><td class="nowrap">' + esc(iv.saat || '—') + '</td>' +
      '<td><a data-goto="ogrenci:' + esc(x.st.id) + '"><b>' + esc(x.st.ad) + '</b></a></td>' +
      '<td>' + grpChip(iv.grup || x.st.grup) + '</td>' +
      '<td class="nowrap small">' + esc([iv.sinav, iv.alinan].filter(Boolean).join(' · ')) + (iv.hedef ? ' <span class="dim">/ ' + esc(iv.hedef) + '</span>' : '') + '</td>' +
      '<td>' + (iv.yonlendirme === 'Evet' ? '<span class="chip warn">Yönlendirme</span>' : '') + (iv.erisimSorunu === 'Evet' ? ' <span class="chip bad">Erişim</span>' : '') + (iv.kaynak === 'arama-konsolu' ? ' <span class="chip src">konsol</span>' : '') + '</td>' +
      '<td class="small" style="max-width:340px">' + esc(iv.gorusmeNotu || iv.islem || '') + '</td></tr>';
  }).join('');

  const taskRows = tasks.map(t => '<tr><td><b>' + esc(t.gorev) + '</b>' + (t.sahip ? ' ' + kimChip(t.sahip) : '') + (t.aciklama ? '<div class="dim small">' + esc(t.aciklama) + '</div>' : '') + '</td>' +
    '<td class="nowrap">' + esc(t.bolum) + '</td><td class="nowrap">' + esc(t.kapsam) + '</td><td>' + durumChip(t.durum) + '</td>' +
    '<td class="small">' + esc(t.sonraki) + '</td><td class="nowrap">' + (t.id ? rowActions('task', t.id) : '') + '</td></tr>').join('');

  const et = UI.editTask;
  const tv = k => esc(et ? et[k] || '' : '');
  const gorevFormHtml = UI.gorevForm ?
    '<form class="card-pad" data-action="gorev-kaydet"' + (et ? ' data-edit-id="' + esc(et.id) + '"' : '') + ' style="border-top:1px solid var(--border)"><div class="fgrid">' +
    '<div class="field"><label>Çalışma / Görev</label><input name="gorev" required value="' + tv('gorev') + '"></div>' +
    '<div class="field"><label>İlgili Bölüm</label><input name="bolum" value="' + tv('bolum') + '"></div>' +
    '<div class="field"><label>Kapsam / Adet</label><input name="kapsam" value="' + tv('kapsam') + '"></div>' +
    '<div class="field"><label>Durum</label><select name="durum">' + selectOpts(DB.catalogs.gorevDurumlari, et ? et.durum : 'Tamamlandı', true) + '</select></div>' +
    '<div class="field wide"><label>Açıklama</label><textarea name="aciklama" rows="2">' + tv('aciklama') + '</textarea></div>' +
    '<div class="field wide"><label>Sonraki Adım</label><input name="sonraki" value="' + tv('sonraki') + '"></div>' +
    '</div><div class="form-actions"><button class="btn primary" type="submit">' + (et ? 'Görevi Güncelle' : 'Görevi Ekle') + '</button>' +
    '<button class="btn" type="button" data-action="gorev-vazgec">Vazgeç</button></div></form>' : '';

  return '<div class="page-head"><div><h1>Gün Sonu Raporu</h1>' +
    '<div class="sub">Ümit Hoca ve Tijen Hoca’ya sunulmak üzere · Hazırlayan: ' + esc(ADIM || 'Kubilay Kenan Hoca') + '</div></div>' +
    '<div class="head-actions">' +
    '<button class="btn" data-action="ozet-kopyala"' + (list.length ? '' : ' disabled') + '>Özeti Kopyala</button>' +
    '<button class="btn" data-action="sunum" title="Excel şablonuyla birebir aynı düzen — yazdır ya da PDF kaydet"' + (list.length || tasks.length ? '' : ' disabled') + '>📊 Sunum Görünümü</button>' +
    '<button class="btn" data-action="yazdir"' + (list.length || tasks.length ? '' : ' disabled') + '>Yazdır</button>' +
    '<button class="btn" data-action="csv-gun"' + (list.length ? '' : ' disabled') + '>CSV</button>' +
    '<button class="btn primary" data-goto="yeni">+ Yeni Görüşme</button></div></div>' +
    '<div class="toolbar">' +
    '<button class="btn sm" data-action="gun-git" data-d="' + prev + '"' + (prev ? '' : ' disabled') + '>‹ Önceki</button>' +
    '<input type="date" value="' + date + '" data-action="gun-sec">' +
    '<button class="btn sm" data-action="gun-git" data-d="' + next + '"' + (next ? '' : ' disabled') + '>Sonraki ›</button>' +
    '<b>' + fmtDate(date, true) + '</b></div>' +
    '<div class="tiles section">' + tiles + '</div>' +
    '<div class="card section"><div class="card-pad"><h2 class="card-title" style="margin-bottom:0">Görüşülen Öğrenciler</h2></div>' +
    '<div class="twrap"><table class="data"><thead><tr><th>Saat</th><th>Öğrenci</th><th>Grup</th><th>Sınav / Puan</th><th>İşaret</th><th>Not / Sonuç</th></tr></thead>' +
    '<tbody>' + (rows || '<tr><td colspan="6" class="empty">Bu tarihte görüşme kaydı yok</td></tr>') + '</tbody></table></div></div>' +
    '<div class="card section"><div class="card-pad" style="display:flex;justify-content:space-between;align-items:center;gap:10px">' +
    '<h2 class="card-title" style="margin:0">Ek Çalışmalar / Görevler</h2>' +
    (UI.gorevForm ? '' : '<button class="btn sm" data-action="gorev-ac">+ Görev Ekle</button>') + '</div>' +
    (taskRows ? '<div class="twrap"><table class="data"><thead><tr><th>Görev</th><th>Bölüm</th><th>Kapsam</th><th>Durum</th><th>Sonraki Adım</th><th></th></tr></thead><tbody>' + taskRows + '</tbody></table></div>'
      : (UI.gorevForm ? '' : '<div class="empty">Bu tarihte ek görev kaydı yok</div>')) +
    gorevFormHtml + '</div>' +
    '<div class="card section card-pad"><h2 class="card-title">Günün Genel Değerlendirmesi</h2>' +
    '<form data-action="not-kaydet"><textarea name="not" rows="4" placeholder="Günün kısa değerlendirmesini yazın…">' + esc(note.replace(/^Günün Genel Değerlendirmesi\s*/, '')) + '</textarea>' +
    '<div class="form-actions"><button class="btn primary" type="submit">Değerlendirmeyi Kaydet</button></div></form></div>';
}

function vFollowups() {
  const order = { 'Açık': 0, 'Beklemede': 1, 'Kapandı': 2 };
  const alSet = satisAliciSeti(); /* v33: satın alanlara rozet + tek tık kapatma */
  const list = DB.followups.slice()
    .sort((a, b) => ((order[a.durum] !== undefined ? order[a.durum] : 1) - (order[b.durum] !== undefined ? order[b.durum] : 1)) || String(b.acilis).localeCompare(String(a.acilis)));
  const rows = list.map(f => {
    const st = DB.students.find(s => (f.tel && s.tel === f.tel) || s.ad.toLocaleLowerCase('tr') === f.ogrenci.toLocaleLowerCase('tr'));
    const aldi = f.durum !== 'Kapandı' ? aliciMi(alSet, f.tel, f.ogrenci, st ? st.id : '', f.acilis) : 0;
    return '<tr><td class="nowrap">' + esc(fmtDate(f.acilis)) + '</td>' +
      '<td>' + (st ? '<a data-goto="ogrenci:' + esc(st.id) + '"><b>' + esc(f.ogrenci) + '</b></a>' : '<b>' + esc(f.ogrenci) + '</b>') +
      (f.grup && f.grup !== '-' ? '<div>' + grpChip(f.grup) + '</div>' : '') + '</td>' +
      '<td style="max-width:380px">' + esc(f.konu) +
      (f.hedefTarih && f.durum !== 'Kapandı' ? ' ' + (f.hedefTarih < todayISO() ? '<span class="chip bad">⏰ ' + fmtDate(f.hedefTarih) + ' gecikti</span>' : f.hedefTarih === todayISO() ? '<span class="chip warn">⏰ Bugün dönüş günü</span>' : '<span class="chip">⏰ ' + fmtDate(f.hedefTarih) + '</span>') : '') +
      (aldi === 2 ? ' <span class="chip ok" title="Geçerli satışı var — bu takip büyük ihtimalle kapatılabilir">🛒 satın aldı</span>' :
        aldi === 1 ? ' <span class="chip warn" title="Yalnız AD benzerliğiyle eşleşti — aynı adlı başka biri olabilir, doğrulayın">🛒 satın almış olabilir?</span>' :

/* ---------- CSV ---------- */
function satisCsvRows(kisiler) {
  const head = ['Ad', 'Telefon', 'Grup', 'Temas', 'İlk görüşme', 'Görüşme ilişkisi', 'Son alım', 'Sipariş', 'Tutar', 'İptal/hata', 'Sitede kart', 'Ürünler'];
  const rows = kisiler.map(k => [
    k.ad, fmtPhone(k.tel), k.grup, k.temas.split('/').map(t => TEMAS_AD[t] || t).join(' + '),
    k.ilkGorusme || '', KONUM_AD[k.konum] || '', k.sonTarih || '', k.gecerliAdet,
    Math.round(k.gecerliTutar), k.redAdet ? Math.round(k.redTutar) : '',
    k.ogrenciId ? 'var' : 'yok', k.satirlar.filter(satisGecerli).map(r => r.urun).join(' | ')
  ]);
  return [head].concat(rows);
}

const IV_COLS = [
  ['grup', 'Öğrenci Grubu'], ['ad', 'Öğrenci Adı Soyadı'], ['tel', 'Telefon'], ['tarih', 'Tarih'], ['saat', 'Saat'],
  ['deneme', 'Arama Denemesi'], ['sinav', 'Son Girdiği Sınav'], ['alinan', 'Alınan Puan'], ['hedef', 'Hedef Puan'],
  ['yakinSinav', 'Yakın Sınav'], ['puanYeterli', 'Puanı Yeterli mi?'], ['devamEdiyor', 'Çalışmaya Devam Ediyor mu?'],
  ['kursuTamamladi', 'Kursu Tamamladı mı?'], ['yonlendirme', 'Yönlendirme İstiyor mu?'], ['anaProgram', 'Ana Program'],
  ['ekDers', 'Ek Ders / İçerik'], ['baskaProgram', 'Başka Program Düşünüyor mu?'], ['dusunulenProgram', 'Düşündüğü Program'],
  ['erisimSorunu', 'Erişim Sorunu'], ['gorusmeNotu', 'Görüşme Notu'], ['onerilen', 'Önerilen Program / Ders'], ['islem', 'Yapılan İşlem / Sonuç'],
  ['gorusen', 'Görüşen']
];
function ivRows(list) {
  return [IV_COLS.map(c => c[1])].concat(list.map(x =>
    IV_COLS.map(c => c[0] === 'ad' ? x.st.ad : c[0] === 'tel' ? x.st.tel : x.iv[c[0]] || '')));
}

/* ---------- olaylar ---------- */
function formData(form) {
  const o = {};
  new FormData(form).forEach((v, k) => { o[k] = String(v).trim(); });
  return o;
}
function findStudentByForm(ad, tel) {
  const t = normTel(tel);
  if (t) { const s = DB.students.find(x => x.tel === t); if (s) return s; }
  const a = adKey(ad);
  return a ? DB.students.find(x => adKey(x.ad) === a) || null : null;
}

});

let araTimer = null;

  if (!DB) return;

    UI.arQ = el.value;
    clearTimeout(araTimer);
    araTimer = setTimeout(() => {
      render();
      const s = document.querySelector('input[data-action=ar-ara]');
      if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    }, 200);
    return;
  }
  if (el.dataset.action === 'ara' || el.dataset.action === 'gara' || el.dataset.action === 'sara') {

    if (alan === 'ara') UI.q = el.value;
    else if (alan === 'sara') UI.sq = el.value;
    else UI.gq = el.value;
    clearTimeout(araTimer);
    araTimer = setTimeout(() => {
      render();
      const s = $('input[data-action=' + alan + ']');
      if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    }, 200);
  } else if (el.dataset.action === 'gsearch') {
    const list = el.closest('.gs-box').querySelector('.ac-list');
    const q = el.value.trim();

    const hits = DB.students.filter(st => matchStudent(st, q)).slice(0, 7);
    list.innerHTML = hits.map(st => '<div class="ac-item" data-action="gs-pick" data-id="' + esc(st.id) + '"><span>' + esc(st.ad) + '</span><span class="dim small">' + esc(fmtPhone(st.tel)) + '</span></div>').join('') ||

    const kuyrukMu = el.dataset.action === 'kac';
    const list = $(kuyrukMu ? '#kac-list' : '#ac-list');
    const q = el.value.trim();
    if (!list) return;
    if (q.length < 2) { list.hidden = true; return; }
    const hits = DB.students.filter(st => matchStudent(st, q)).slice(0, 8);
    const pick = kuyrukMu ? 'kuyruk-sec' : 'ac-pick';
    list.innerHTML = hits.map(st => '<div class="ac-item" data-action="' + pick + '" data-id="' + esc(st.id) + '"><span>' + esc(st.ad) + ' ' + grpChip(st.grup) + '</span><span class="dim">' + esc(fmtPhone(st.tel)) + '</span></div>').join('') +
      (kuyrukMu
        ? '<div class="ac-item" data-action="kuyruk-sec-yeni" data-ad="' + esc(q) + '">"' + esc(q) + '" kayıtsız olarak kuyruğa ekle</div>'
        : '<div class="ac-item dim">"' + esc(q) + '" yeni öğrenci olarak kaydedilecek</div>');
    list.hidden = false;
  }
  const form = el.closest('form[data-action=gorusme-kaydet]');
  if (form && !form.dataset.id) lsSet('kh-draft', JSON.stringify(formData(form)));
});

document.addEventListener('submit', e => {
  const form = e.target;
  const act = form.dataset.action;
  if (!act || !DB) return;
  e.preventDefault();
  const d = formData(form);

  if (act === 'gorusme-kaydet' && form.dataset.editId) {
    const hit = findIv(form.dataset.editId);
    if (!hit) return;
    const iv = {
      grup: d.grup, tarih: d.tarih, saat: d.saat, deneme: d.deneme, sinav: d.sinav,
      alinan: d.alinan, hedef: d.hedef, yakinSinav: d.yakinSinav,
      puanYeterli: d.puanYeterli, devamEdiyor: d.devamEdiyor, kursuTamamladi: d.kursuTamamladi,
      yonlendirme: d.yonlendirme, anaProgram: d.anaProgram, ekDers: d.ekDers,
      baskaProgram: d.baskaProgram, dusunulenProgram: d.dusunulenProgram, erisimSorunu: d.erisimSorunu,
      gorusmeNotu: d.gorusmeNotu, onerilen: d.onerilen, islem: d.islem
    };

  } else if (act === 'gorusme-kaydet') {

    let yeni = null;
    if (!studentId) {
      const found = findStudentByForm(d.ogrenciAd, d.tel);
      if (found) studentId = found.id;
      else yeni = { ad: d.ogrenciAd, tel: normTel(d.tel), grup: d.grup || '' };
    }
    const st = studentId ? stById(studentId) : null;
    const iv = {
      grup: d.grup || (st ? st.grup : ''), tarih: d.tarih, saat: d.saat,
      deneme: d.deneme, sinav: d.sinav, alinan: d.alinan, hedef: d.hedef, yakinSinav: d.yakinSinav,
      puanYeterli: d.puanYeterli, devamEdiyor: d.devamEdiyor, kursuTamamladi: d.kursuTamamladi,
      yonlendirme: d.yonlendirme, anaProgram: d.anaProgram, ekDers: d.ekDers,
      baskaProgram: d.baskaProgram, dusunulenProgram: d.dusunulenProgram, erisimSorunu: d.erisimSorunu,
      gorusmeNotu: d.gorusmeNotu, onerilen: d.onerilen, islem: d.islem,
      kaynak: form.dataset.konsol ? 'arama-konsolu' : 'yeni' /* gorusen alanini sunucu, giris yapan kisiyle damgalar */
    };
    persist('addInterview', { studentId: studentId, yeni: yeni, iv: iv },
      'Görüşme kaydedildi: ' + (st ? st.ad : (yeni ? yeni.ad : '')))
      .then(ok => {
        if (!ok) return;
        lsDel('kh-draft'); UI.raporDate = iv.tarih; agsAfterInterview(studentId, yeni);
        if (form.dataset.konsol) { arKaydettikten(form.dataset.konsol); return; }
        go('rapor', iv.tarih);
      });
  } else if (act === 'ogrenci-kaydet') {
    persist('updateStudent', {
      id: form.dataset.id, ad: d.ad, tel: normTel(d.tel), grup: d.grup, hedef: d.hedef,
      programlar: d.programlar.split('\n').map(s => s.trim()).filter(Boolean), sonSonuc: d.sonSonuc
    }, 'Öğrenci bilgileri güncellendi');
  } else if (act === 'gorev-kaydet') {
    /* v33: kayıt SUNUCUDA onaylanmadan form kapanmış sayılmaz — hata olursa bayraklar geri açılır */
    UI.gorevForm = false;
    const payload = { gorev: d.gorev, bolum: d.bolum, kapsam: d.kapsam, durum: d.durum, aciklama: d.aciklama, sonraki: d.sonraki };
    if (form.dataset.editId) {
      payload.id = form.dataset.editId;
      const oncekiEdit = UI.editTask;
      UI.editTask = null;
      persist('updateTask', payload, 'Görev güncellendi')
        .then(ok => { if (!ok) { UI.gorevForm = true; UI.editTask = oncekiEdit; } });
    } else {
      payload.tarih = UI.raporDate;
      persist('addTask', payload, 'Ek görev eklendi')
        .then(ok => { if (!ok) UI.gorevForm = true; });
    }
  } else if (act === 'not-kaydet') {
    persist('setNote', { tarih: UI.raporDate, not: d.not }, 'Gün değerlendirmesi kaydedildi');
  } else if (act === 'sinav-ekle') {
    if (d.bas && d.bit && d.bit < d.bas) { toast('Başvuru bitişi başlangıçtan önce olamaz', 3600, true); return; }
    const list = sinavTakvimi().concat([{ id: 'sv' + Date.now(), ad: d.ad.trim(), anahtar: d.anahtar.trim(), tarih: d.tarih, bas: d.bas || '', bit: d.bit || '' }]);
    persist('setSinavTakvimi', { json: JSON.stringify(list) }, '"' + d.ad.trim() + '" takvime eklendi');
  } else if (act === 'katalog-ekle') {
    persist('addCatalog', { tur: form.dataset.tur, deger: d.deger }, '"' + d.deger + '" listeye eklendi');
  } else if (act === 'hedef-kaydet') {
    UI.hedefEdit = false;
    persist('setHedef', { deger: d.deger }, 'Aylık hedef kaydedildi 🎯')
      .then(ok => { if (!ok) UI.hedefEdit = true; }); /* v33 */
  } else if (act === 'ciro-kaydet') { /* v34: aylık net ciro hedefi */
    UI.ciroEdit = false;
    persist('setCiroHedef', { deger: d.deger }, 'Aylık ciro hedefi kaydedildi 💰')
      .then(ok => { if (!ok) UI.ciroEdit = true; });
  } else if (act === 'kuyruk-planla') { /* v34: toplu planlama sihirbazı */
    const kapasite = Math.max(1, Math.min(60, parseInt(d.kapasite, 10) || 20));
    let gun = d.baslangic && /^\d{4}-\d{2}-\d{2}$/.test(d.baslangic) ? d.baslangic : todayISO();
    if (gun < todayISO()) gun = todayISO();
    const bekleyen = DB.queue.filter(q => q.durum === 'Bekliyor');
    const bugunT = todayISO();
    /* sıra: bugüne/geçmişe zaten planlılar başa (bugünün listesi ileriye savrulmasın — yalnız
       'hepsi' kapsamında anlamlı), sonra ★ öncelikliler, sonra en uzun süredir bekleyenler */
    const hedefler = (d.kapsam === 'hepsi' ? bekleyen : bekleyen.filter(q => !q.planTarih)).slice()
      .sort((a, b) => ((a.planTarih && a.planTarih <= bugunT) ? 0 : 1) - ((b.planTarih && b.planTarih <= bugunT) ? 0 : 1) ||
        (b.oncelik === '1' ? 1 : 0) - (a.oncelik === '1' ? 1 : 0) ||
        tarihTam(a.eklenme).localeCompare(tarihTam(b.eklenme)) || String(a.id).localeCompare(String(b.id)));
    if (!hedefler.length) { toast('Planlanacak kayıt yok.', 3200, true); return; }
    const pazarAtla = t => { /* Pazar günü arama planlanmaz */
      let g = t;
      while (new Date(g.slice(0, 4), Number(g.slice(5, 7)) - 1, Number(g.slice(8, 10))).getDay() === 0) g = gunEkle(g, 1);
      return g;
    };
    /* dağıtım dışı kalan bekleyenlerin mevcut planları günlük kapasiteden düşülür —
       bugün 15 planlıyken kapasite 20 ile bugüne 35 arama yığılmasın */
    const hedefSet = new Set(hedefler.map(q => q.id));
    const yuk = {};
    bekleyen.forEach(q => { if (q.planTarih && !hedefSet.has(q.id)) yuk[q.planTarih] = (yuk[q.planTarih] || 0) + 1; });
    gun = pazarAtla(gun);
    let kalan = Math.max(0, kapasite - (yuk[gun] || 0));
    const plans = hedefler.map(q => {
      while (kalan === 0) { gun = pazarAtla(gunEkle(gun, 1)); kalan = Math.max(0, kapasite - (yuk[gun] || 0)); }
      kalan--;
      return { id: q.id, planTarih: gun, oncelik: q.oncelik === '1' };
    });
    UI.kuyrukSihir = false;
    persist('planKuyrukToplu', { plans: plans }, plans.length + ' kişi ' + fmtDate(plans[0].planTarih) + ' – ' + fmtDate(plans[plans.length - 1].planTarih) + ' arasına dağıtıldı 🪄')
      .then(ok => { if (!ok) UI.kuyrukSihir = true; });
  } else if (act === 'sablon-kaydet') {
    UI.sablonForm = false; /* v33: hata olursa geri açılır */
    if (form.dataset.editId) {
      const oncekiSablon = UI.editSablon;
      UI.editSablon = null;
      persist('updateTemplate', { id: form.dataset.editId, ad: d.ad, metin: d.metin }, 'Şablon güncellendi')
        .then(ok => { if (!ok) { UI.sablonForm = true; UI.editSablon = oncekiSablon; } });
    } else {
      persist('addTemplate', { ad: d.ad, metin: d.metin }, 'Şablon eklendi')
        .then(ok => { if (!ok) UI.sablonForm = true; });
    }
  } else if (act === 'kisi-ekle') {
    UI.kisiForm = false;
    persist('setKisi', { ad: d.ad, sifre: d.sifre, rol: d.rol }, 'Kişi kaydedildi')
      .then(ok => { if (!ok) UI.kisiForm = true; }); /* v33 */
  } else if (act === 'kisi-sifre-kaydet') {
    if (d.sifre !== d.sifre2) { toast('Şifreler eşleşmiyor', 3500, true); return; }
    const oncekiKS = UI.kisiSifre;
    UI.kisiSifre = '';
    persist('setKisi', { ad: form.dataset.ad, sifre: d.sifre }, form.dataset.ad + ' şifresi değiştirildi 🔑')
      .then(ok => { if (!ok) UI.kisiSifre = oncekiKS; }); /* v33 */
  } else if (act === 'sifre-degistir') {
    if (d.yeni !== d.yeni2) { toast('Yeni şifreler eşleşmiyor', 3500, true); return; }
    persist('sifreDegistir', { eski: d.eski, yeni: d.yeni }, 'Şifreniz değiştirildi 🔑')
      .then(ok => {
        /* bellekteki sifre eskirse sonraki her istek reddedilir — hemen guncelle */
        if (ok) { PASS = d.yeni; lsSet('kh-pass', d.yeni); lsSet('kh-t', String(Date.now())); }
      });
  } else if (act === 'takip-kaydet') {
    UI.takipForm = false; /* v33: hata olursa aşağıda geri açılır */
    if (form.dataset.editId) {
      const oncekiTakip = UI.editTakip;
      UI.editTakip = null;
      persist('updateFollowup', {
        id: form.dataset.editId, ogrenci: d.ogrenci, tel: normTel(d.tel), grup: d.grup,
        konu: d.konu, sorumlu: d.sorumlu, hedefTarih: d.hedefTarih || '', not: d.not
      }, 'Takip güncellendi')
        .then(ok => { if (!ok) { UI.takipForm = true; UI.editTakip = oncekiTakip; } });
    } else {
      persist('addFollowup', {
        acilis: todayISO(), /* v34.1: yıllı ISO — sunucu da tarihNorm'la katlar */
        ogrenci: d.ogrenci, tel: normTel(d.tel), grup: d.grup, konu: d.konu,
        sorumlu: d.sorumlu, hedefTarih: d.hedefTarih || '', durum: 'Açık', not: d.not
      }, 'Takip eklendi')
        .then(ok => { if (!ok) UI.takipForm = true; });
    }
  }
});

/* ================= v19: kim yaptı imzası, kişi yönetimi, aylık rapor, içgörüler ================= */

/* verideki + Kisiler sayfasındaki tüm görüşen adları (filtre ve panel için) */
function gorusenListesi() {
  const set = new Set();
  allInterviews().forEach(x => { const k = kimAd(x.iv.gorusen); if (k) set.add(k); });
  (DB.kisiler || []).forEach(k => { const a = kimAd(k.ad); if (a) set.add(a); });
  return [...set].sort((a, b) => a.localeCompare(b, 'tr'));
}

/* [bas, bit) aralığında kişi başına görüşme / görev / AGS sayıları */
function kisiSayaclari(bas, bit) {
  const m = {};
  const ekle = (ad, alan) => {
    const k = kimAd(ad);
    if (!k) return;
    if (!m[k]) m[k] = { gorusme: 0, gorev: 0, ags: 0 };
    m[k][alan]++;
  };
  allInterviews().forEach(x => { const t = x.iv.tarih || ''; if (t >= bas && t < bit) ekle(x.iv.gorusen, 'gorusme'); });
  DB.tasks.forEach(t => { const d = t.tarih || ''; if (d >= bas && d < bit) ekle(t.sahip, 'gorev'); });
  (DB.agsAdaylar || []).forEach(a => { const g = String(a.gorusmeTarihi || '').slice(0, 10); if (g && g >= bas && g < bit) ekle(a.gorusen, 'ags'); });
  return m;
}

function vKisiPanel() {
  const today = todayISO();
  const aralik = UI.kisiAralik === 'hafta' ? 'hafta' : 'gun';
  const bas = aralik === 'hafta' ? haftaBasi(today) : today;
  const bit = aralik === 'hafta' ? gunEkle(haftaBasi(today), 7) : gunEkle(today, 1);
  const say = kisiSayaclari(bas, bit);
  const adlar = [...new Set(Object.keys(say).concat((DB.kisiler || []).map(k => kimAd(k.ad))))].filter(Boolean);
  const topla = a => { const v = say[a] || {}; return (v.gorusme || 0) + (v.gorev || 0) + (v.ags || 0); };
  adlar.sort((a, b) => topla(b) - topla(a) || a.localeCompare(b, 'tr'));
  const enCok = Math.max(1, ...adlar.map(topla));
  const acikTakip = a => DB.followups.filter(f => f.durum === 'Açık' && kimAd(f.ekleyen) === a).length;
  const satirlar = adlar.map(a => {
    const v = say[a] || { gorusme: 0, gorev: 0, ags: 0 };
    const t = topla(a);
    const detay = [v.gorusme ? v.gorusme + ' görüşme' : '', v.ags ? v.ags + ' aday' : '', v.gorev ? v.gorev + ' görev' : '',
      acikTakip(a) ? acikTakip(a) + ' açık takip' : ''].filter(Boolean).join(' · ') || 'kayıt yok';
    return '<div class="gbar" style="grid-template-columns:180px 1fr 46px">' +
      '<span class="gl"><span class="avatar ' + avatarClass(a) + '" style="margin-right:6px">' + esc(initials(a)) + '</span>' + esc(a) + '</span>' +
      '<span class="track" title="' + esc(detay) + '"><span class="fill" style="width:' + (t / enCok * 100).toFixed(1) + '%"></span></span>' +
      '<span class="gv">' + t + '</span>' +
      '<span class="dim small" style="grid-column:2/4">' + esc(detay) + '</span></div>';
  }).join('');
  return '<div class="card section card-pad"><div class="toolbar" style="margin-bottom:8px">' +
    '<h2 class="card-title" style="margin:0">Kim Ne Yaptı</h2><span class="grow"></span>' +
    '<span class="seg"><button data-action="kisi-aralik" data-v="gun"' + (aralik === 'gun' ? ' class="active"' : '') + '>Bugün</button>' +
    '<button data-action="kisi-aralik" data-v="hafta"' + (aralik === 'hafta' ? ' class="active"' : '') + '>Bu hafta</button></span></div>' +
    (satirlar || '<div class="dim small">Kayıt yok</div>') +
    '<div class="small dim" style="margin-top:8px">Kaydı giren kişi sunucuda işaretlenir. Eylül 2026 öncesi kayıtların tamamı Kubilay Kenan Hoca adına görünür.</div></div>';
}

    '</div><div class="form-actions"><button class="btn primary" type="submit">Kişiyi Ekle</button>' +
    '<button class="btn" type="button" data-action="kisi-vazgec">Vazgeç</button></div></form></div>' : '';
  return '<div class="page-head"><div><h1>Kişiler & Şifreler</h1>' +
    '<div class="sub">Siteye kimlerin gireceğini ve yetkilerini buradan yönetin — şifreler yalnızca burada değişir</div></div>' +

/* ---------- genel çubuk grafiği (İçgörüler) ---------- */
function barChartSVG(items, opts) {
  opts = opts || {};
  const W = opts.W || 760, H = opts.H || 168, padL = 26, padB = 22, padT = 16;
  const n = Math.max(1, items.length);
  const iw = (W - padL - 8) / n;
  const bw = Math.min(iw - 2, opts.bw || 26);
  const yh = H - padT - padB;
  const maxN = Math.max(1, ...items.map(x => x.n));
  const maxIdx = items.findIndex(x => x.n === maxN);
  const bars = items.map((x, i) => {
    const h = Math.round(x.n / maxN * yh);
    const bx = (padL + i * iw + (iw - bw) / 2).toFixed(1);
    const by = H - padB - h;
    const r = x.n > 0 ? Math.min(3, h) : 0;
    const path = x.n === 0 ? '' :
      '<path class="bar" d="M' + bx + ',' + (H - padB) + ' v' + (-(h - r)) + ' q0,' + (-r) + ' ' + r + ',' + (-r) + ' h' + (bw - 2 * r) + ' q' + r + ',0 ' + r + ',' + r + ' v' + (h - r) + ' z">' +
      '<title>' + esc(x.l + ' — ' + x.n + (opts.birim || '')) + '</title></path>';
    const gizle = opts.seyrek && n > 16 && (i % 2 === 1);
    const lbl = gizle ? '' : '<text x="' + (padL + i * iw + iw / 2).toFixed(1) + '" y="' + (H - padB + 14) + '" text-anchor="middle">' + esc(x.k || x.l) + '</text>';
    const val = (i === maxIdx && x.n > 0) ? '<text class="val" x="' + (padL + i * iw + iw / 2).toFixed(1) + '" y="' + (by - 5) + '" text-anchor="middle">' + x.n + '</text>' : '';
    return path + lbl + val;
  }).join('');
  return '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts.baslik || 'Dağılım') + '">' +
    '<line class="grid" x1="' + padL + '" y1="' + (H - padB - yh / 2) + '" x2="' + (W - 8) + '" y2="' + (H - padB - yh / 2) + '"/>' +
    '<line class="axis" x1="' + padL + '" y1="' + (H - padB) + '" x2="' + (W - 8) + '" y2="' + (H - padB) + '"/>' +
    '<text x="' + (padL - 6) + '" y="' + (padT + 4) + '" text-anchor="end">' + maxN + '</text>' +
    '<text x="' + (padL - 6) + '" y="' + (H - padB - yh / 2 + 4) + '" text-anchor="end">' + Math.round(maxN / 2) + '</text>' +
    bars + '</svg>';
}
function gbarListesi(ciftler, opts) {
  opts = opts || {};
  const max = Math.max(1, ...ciftler.map(c => c[1]));
  return ciftler.map(c => '<div class="gbar"><span class="gl">' + esc(c[0]) + '</span>' +
    '<span class="track"><span class="fill" style="width:' + (c[1] / max * 100).toFixed(1) + '%"></span></span>' +
    '<span class="gv">' + c[1] + (opts.yuzde && opts.yuzde[c[0]] !== undefined ? ' <span class="dim small">%' + opts.yuzde[c[0]] + '</span>' : '') + '</span></div>').join('');
}

function ayListesi() {
  const set = new Set();
  allInterviews().forEach(x => { const t = (x.iv.tarih || '').slice(0, 7); if (t) set.add(t); });
  DB.tasks.forEach(t => { const d = (t.tarih || '').slice(0, 7); if (d) set.add(d); });
  return [...set].sort().reverse();
}
function ayAdiUzun(m) { return AYLAR[Number(m.slice(5)) - 1] + ' ' + m.slice(0, 4); }
function ayRaporVerisi(ay) {
  const iv = allInterviews().filter(x => (x.iv.tarih || '').startsWith(ay));
  const ogrMap = new Map();
  iv.forEach(x => { if (!ogrMap.has(x.st.id)) ogrMap.set(x.st.id, x.st); });
  const ogr = [...ogrMap.values()];
  const grup = {};
  iv.forEach(x => { const g = x.iv.grup || x.st.grup || 'Belirsiz'; grup[g] = (grup[g] || 0) + 1; });
  const kisi = {};
  iv.forEach(x => { const k = kimAd(x.iv.gorusen) || '—'; kisi[k] = (kisi[k] || 0) + 1; });
  const gorevler = DB.tasks.filter(t => (t.tarih || '').startsWith(ay));
  const sayim = {};
  iv.forEach(x => { sayim[x.st.id] = (sayim[x.st.id] || 0) + 1; });
  const oneCikan = ogr.slice().sort((a, b) => (sayim[b.id] || 0) - (sayim[a.id] || 0)).slice(0, 10);
  const gunler = [...new Set(iv.map(x => x.iv.tarih))].filter(Boolean);
  return {
    ay: ay, iv: iv, ogr: ogr, stat: dayStats(iv), grup: grup, kisi: kisi, gorevler: gorevler,
    kayit: ogr.filter(s => s.kayitDurumu === 'Kayıt oldu'),

/* v34 (madde 9): gerçek dönüşüm hunisi — kaynak başına aranan → yönlendirme → satış → net ciro.
   Satış eşleşmesi ogrenciId üzerinden (panel aktarımı dolduruyor); öğrenci, İLK görüşmesinin
   kaynağına yazılır ki huni katmanları aynı kişiyi iki kez saymasın. */
function kaynakHunisi() {
  /* huni yalnız GÖRÜŞME SONRASI alımları sayar (konum='sonra' — vSatis'teki dönüşüm tanımıyla aynı);
     görüşme öncesi eski alımlar kaynağın başarısı gibi görünmesin */
  const satisNet = {};
  (DB.satislar || []).forEach(r => {
    if (r.ogrenciId && satisGecerli(r) && r.konum === 'sonra') satisNet[r.ogrenciId] = (satisNet[r.ogrenciId] || 0) + (parseFloat(r.tutar) || 0);
  });
  const b = {};
  DB.students.forEach(st => {
    if (!st.gorusmeler.length) return;
    const ilk = st.gorusmeler.slice().sort((x, y) => ((x.tarih || '') + (x.saat || '')).localeCompare((y.tarih || '') + (y.saat || '')))[0];
    const k = SRC_AD[ilk.kaynak] || ilk.kaynak || 'Bilinmiyor';
    if (!b[k]) b[k] = { aranan: 0, yonl: 0, satis: 0, ciro: 0 };
    b[k].aranan++;
    if (st.gorusmeler.some(g => g.yonlendirme === 'Evet')) b[k].yonl++;
    if (satisNet[st.id]) { b[k].satis++; b[k].ciro += satisNet[st.id]; }
  });
  const list = Object.entries(b).sort((x, y) => y[1].ciro - x[1].ciro || y[1].aranan - x[1].aranan);
  if (!list.length) return '';
  const rows = list.map(([k, v]) =>
    '<tr><td>' + esc(k) + '</td><td class="num">' + v.aranan + '</td>' +
    '<td class="num">' + v.yonl + ' <span class="dim small">%' + (v.aranan ? Math.round(v.yonl / v.aranan * 100) : 0) + '</span></td>' +
    '<td class="num">' + v.satis + ' <span class="dim small">%' + (v.aranan ? Math.round(v.satis / v.aranan * 100) : 0) + '</span></td>' +
    '<td class="num"><b>' + fmtTL(v.ciro) + '</b></td></tr>').join('');
  return '<div class="card section"><div class="card-pad"><h2 class="card-title" style="margin:0">Dönüşüm Hunisi — Kaynak Bazlı (gerçek satış verisi)</h2></div>' +
    '<div class="twrap"><table class="data"><thead><tr><th>Kaynak (ilk görüşme)</th><th class="num">Görüşülen öğrenci</th><th class="num">Yönlendirme istedi</th><th class="num">Satın aldı</th><th class="num">Net ciro</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div>' +
    '<div class="card-pad small dim">Yalnız GÖRÜŞME SONRASI yapılan geçerli alımlar sayılır (iptal/iade ve görüşme öncesi eski alımlar hariç); öğrenci, İLK görüşmesinin kaynağına yazılır. Karta bağlanmamış alıcılar tabloda görünmez — <a data-goto="satis">Ders Alanlar</a>\'daki "kart yok" listesinden bağlayın.</div></div>';
}

  /* satın alanlar ogrenciId + telefon anahtarıyla elenir (satisAliciSeti/aliciMi v33 kalıbı) —
     karta bağlanmamış ama telefonu eşleşen alıcı "almadı" diye listelenmesin */

function vIcgoru() {
  const all = allInterviews();
  const saatler = [];
  for (let h = 0; h < 24; h++) {
    const n = all.filter(x => String(x.iv.saat || '').slice(0, 2) === String(h).padStart(2, '0')).length;
    saatler.push({ l: String(h).padStart(2, '0') + ':00', k: String(h), n: n });
  }
  const dolu = saatler.filter(x => x.n > 0);
  const ilk = dolu.length ? Number(dolu[0].k) : 8;
  const son = dolu.length ? Number(dolu[dolu.length - 1].k) : 20;
  const saatDilim = saatler.slice(Math.max(0, ilk - 1), Math.min(24, son + 2));
  const enVerimli = saatler.slice().sort((a, b) => b.n - a.n)[0];

  const gunAd = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi', 'Pazar'];
  const gunSay = [0, 0, 0, 0, 0, 0, 0];
  all.forEach(x => {
    const t = x.iv.tarih || '';
    if (!/^\d{4}-\d{2}-\d{2}/.test(t)) return;
    const [y, m, d] = t.slice(0, 10).split('-').map(Number);
    gunSay[(new Date(y, m - 1, d).getDay() + 6) % 7]++;  /* Pazartesi = 0 */
  });
  const gunKisa = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
  const gunItems = gunAd.map((g, i) => ({ l: g, k: gunKisa[i], n: gunSay[i] }));
  const enVerimliGun = gunItems.slice().sort((a, b) => b.n - a.n)[0];

  const prog = {};
  all.forEach(x => {
    [x.iv.dusunulenProgram, x.iv.anaProgram].forEach(p => {
      const v = String(p || '').trim();
      if (v && v !== '-') prog[v] = (prog[v] || 0) + 1;
    });
  });
  const progList = Object.entries(prog).sort((a, b) => b[1] - a[1]).slice(0, 12);

  /* kaynak bazlı dönüşüm: her kaynakta tekil öğrenci ve kayda dönenler */
  const kaynakMap = {};
  all.forEach(x => {
    const k = SRC_AD[x.iv.kaynak] || x.iv.kaynak || 'Bilinmiyor';
    if (!kaynakMap[k]) kaynakMap[k] = new Set();
    kaynakMap[k].add(x.st.id);
  });
  const kaynakSatir = Object.entries(kaynakMap).map(([k, set]) => {
    const ogr = [...set].map(id => stById(id)).filter(Boolean);
    const kayit = ogr.filter(s => s.kayitDurumu === 'Kayıt oldu').length;
    return { k: k, n: ogr.length, kayit: kayit, oran: ogr.length ? Math.round(kayit / ogr.length * 100) : 0 };
  }).sort((a, b) => b.n - a.n);

  /* aylık sonuç trendi */
  const aylar = ayListesi().slice(0, 8).reverse();
  const trendRows = aylar.map(m => {
    const list = all.filter(x => (x.iv.tarih || '').startsWith(m));
    const s = dayStats(list);
    const y = n => list.length ? Math.round(n / list.length * 100) : 0;
    return '<tr><td class="nowrap">' + esc(ayAdiUzun(m)) + '</td><td class="num">' + list.length + '</td>' +
      '<td class="num">' + s.yonl + ' <span class="dim small">%' + y(s.yonl) + '</span></td>' +
      '<td class="num">' + s.yeterli + ' <span class="dim small">%' + y(s.yeterli) + '</span></td>' +
      '<td class="num">' + s.erisim + ' <span class="dim small">%' + y(s.erisim) + '</span></td>' +
      '<td class="num">' + s.yeniProg + ' <span class="dim small">%' + y(s.yeniProg) + '</span></td></tr>';
  }).join('');

  /* aylık hedefe projeksiyon (içinde bulunulan ay) */
  const today = todayISO(), buAy = today.slice(0, 7);
  const hedef = parseInt(DB.settings.aylikHedef, 10) || 0;
  const buAyIv = all.filter(x => (x.iv.tarih || '').startsWith(buAy)).length;
  const gecenGun = Number(today.slice(8));
  const ayGun = new Date(Number(buAy.slice(0, 4)), Number(buAy.slice(5)), 0).getDate();
  const tahmin = gecenGun ? Math.round(buAyIv / gecenGun * ayGun) : 0;
  const kalanGun = ayGun - gecenGun;
  const gerekli = hedef && kalanGun > 0 ? Math.max(0, Math.ceil((hedef - buAyIv) / kalanGun)) : 0;
  const projeksiyon = '<div class="card section card-pad"><h2 class="card-title">' + esc(ayAdiUzun(buAy)) + ' Projeksiyonu</h2>' +
    '<div class="tiles" style="margin:0">' +
    '<div class="tile t-green"><div class="n">' + buAyIv + '</div><div class="l">Bu ay şu ana kadar</div></div>' +
    '<div class="tile t-sky"><div class="n">' + tahmin + '</div><div class="l">Bu hızla ay sonu tahmini</div></div>' +
    (hedef ? '<div class="tile t-amber"><div class="n">' + hedef + '</div><div class="l">Aylık hedef</div></div>' : '') +
    (hedef && kalanGun > 0 ? '<div class="tile t-lilac"><div class="n">' + gerekli + '</div><div class="l">Hedef için günlük gereken</div></div>' : '') +
    '</div>' + (hedef ? '<div class="small dim" style="margin-top:8px">' +
      (tahmin >= hedef ? '✅ Bu tempoyla aylık hedef tutuyor.' : '⚠️ Bu tempoyla hedefin ' + (hedef - tahmin) + ' görüşme altında kalınır — kalan ' + Math.max(0, kalanGun) + ' günde günlük ' + gerekli + ' görüşme gerekir.') +
      '</div>' : '<div class="small dim" style="margin-top:8px">Aylık hedef belirlenmemiş — Ana Sayfa\'dan ekleyebilirsiniz.</div>') + '</div>';

  return '<div class="page-head"><div><h1>İçgörüler</h1>' +
    '<div class="sub">' + all.length + ' görüşme kaydından çıkarılan eğilimler</div></div></div>' +
    projeksiyon + kaynakHunisi() + vSicakKart() +
    '<div class="card section card-pad"><h2 class="card-title">Saate Göre Görüşmeler</h2>' +
    barChartSVG(saatDilim, { baslik: 'Saat dağılımı', birim: ' görüşme', seyrek: true }) +
    '<div class="small dim">En verimli saat: <b>' + esc(enVerimli.l) + '</b> (' + enVerimli.n + ' görüşme)</div></div>' +
    '<div class="card section card-pad"><h2 class="card-title">Güne Göre Görüşmeler</h2>' +
    barChartSVG(gunItems, { baslik: 'Gün dağılımı', birim: ' görüşme', bw: 46 }) +
    '<div class="small dim">En yoğun gün: <b>' + esc(enVerimliGun.l) + '</b> (' + enVerimliGun.n + ' görüşme)</div></div>' +
    '<div class="card section card-pad"><h2 class="card-title">En Çok İstenen Programlar</h2>' +
    (gbarListesi(progList) || '<span class="dim small">Kayıt yok</span>') + '</div>' +
    '<div class="card section"><div class="card-pad"><h2 class="card-title" style="margin:0">Kaynak Bazlı Kayıt Dönüşümü</h2></div>' +
    '<div class="twrap"><table class="data"><thead><tr><th>Kaynak</th><th class="num">Tekil öğrenci</th><th class="num">Kayıt oldu</th><th class="num">Dönüşüm</th></tr></thead><tbody>' +
    (kaynakSatir.map(r => '<tr><td>' + esc(r.k) + '</td><td class="num">' + r.n + '</td><td class="num">' + r.kayit + '</td>' +
      '<td class="num">' + (r.kayit ? '<b>%' + r.oran + '</b>' : '<span class="dim">%0</span>') + '</td></tr>').join('') ||
      '<tr><td colspan="4" class="empty">Kayıt yok</td></tr>') + '</tbody></table></div></div>' +
    '<div class="card section"><div class="card-pad"><h2 class="card-title" style="margin:0">Aylık Sonuç Trendi</h2></div>' +
    '<div class="twrap"><table class="data"><thead><tr><th>Ay</th><th class="num">Görüşme</th><th class="num">Yönlendirme</th><th class="num">Puanı yeterli</th><th class="num">Erişim sorunu</th><th class="num">Yeni program</th></tr></thead>' +
    '<tbody>' + (trendRows || '<tr><td colspan="6" class="empty">Kayıt yok</td></tr>') + '</tbody></table></div></div>';
}

/* ---------- klavye kısayolları (v25): "/" hızlı aramaya odaklanır, Esc sonuç listesini kapatır ---------- */
document.addEventListener('keydown', e => {
  if (!DB) return;
  const t = e.target;
  const yaziyor = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
  if (e.key === '/' && !yaziyor && !e.metaKey && !e.ctrlKey && !e.altKey) {
    const box = Array.from(document.querySelectorAll('.gs-box input')).find(i => i.offsetParent !== null);
    if (box) { e.preventDefault(); box.focus(); box.select(); }
  } else if (e.key === 'Escape') {
    document.querySelectorAll('.gs-box .ac-list').forEach(l => { l.hidden = true; });
    if (yaziyor && t.closest('.gs-box')) t.blur();
  }
});

/* v34 (madde 8): filtredeki BEKLEYEN adaylardan, Aranacaklar'da bekleyen kaydı olmayanlar.
   Telefonu OLMAYAN adaylar aktarılmaz (arama kuyruğunda numarasız satır işe yaramaz);
   aynı telefonun ikinci formu (parti içi mükerrer) da elenir.
   Sıra: telefonla aranmak isteyenler önce, sonra form sırası (n). */
function agsAktarAdaylari(list) {
  const varOlan = new Set();
  DB.queue.forEach(q => {
    if (q.durum !== 'Bekliyor') return;
    const t = normTel(q.tel); if (t) varOlan.add('t' + t);
    const a = adKey(q.ad); if (a) varOlan.add('a' + a);
    if (q.agsId) varOlan.add('g' + q.agsId);
  });
  const partide = new Set();
  return list.filter(a => {
    if ((a.durum || 'Bekliyor') !== 'Bekliyor') return false;
    if (varOlan.has('g' + a.id)) return false;
    const t = normTel(a.tel);
    if (!t) return false; /* telefonsuz aday: kuyruğa değil, AGS sayfasından e-postayla dönülür */
    if (varOlan.has('t' + t) || partide.has('t' + t)) return false;
    partide.add('t' + t);
    return true;
  }).sort((x, y) => {
    const tx = /telefon/i.test(x.ulasim || '') ? 0 : 1, ty = /telefon/i.test(y.ulasim || '') ? 0 : 1;
    return tx - ty || (parseInt(x.n, 10) || 0) - (parseInt(y.n, 10) || 0);
  });
}

function agsKayit(id) {
  const a = agsById(id);
  if (!a) return;
  if (ROL !== 'admin') { toast('Salt-okunur görünümdesiniz — ses notu eklenemez.', 3800, true); return; }
  if (window.__adaSesW && !window.__adaSesW.closed) {
    try { window.__adaSesW.focus(); } catch (e) {}
    toast('Kayıt penceresi zaten açık — önce onu bitirin veya kapatın.', 3800, true);
    return;
  }
  let w = null;
  try { w = window.open('', 'ada_ses_kaydi', 'width=460,height=400,resizable=yes'); } catch (e) {}
  if (!w) { toast('Kayıt penceresi açılamadı — tarayıcının açılır pencere engelini kaldırın.', 5000, true); return; }
  window.__adaSesW = w;
  window.__adaSesHazir = (blob, mime) => agsSesYukle(id, blob, mime);
  w.document.open();
  w.document.write(AGS_REC_HTML.replace('__AD__', esc(a.ad)));
  w.document.close();
}
function agsSesYukle(id, blob, mime) {
  if (!blob || !blob.size) { toast('Boş kayıt', 3000, true); return; }
  if (blob.size > 12 * 1024 * 1024) { toast('Ses dosyası çok büyük (en fazla 12 MB)', 4000, true); return; }
  toast('Ses notu Drive\'a yükleniyor… (' + Math.round(blob.size / 1024) + ' KB)', 6000);
  const rd = new FileReader();
  rd.onload = () => {
    const b64 = String(rd.result).split(',')[1] || '';
    persist('agsSesEkle', { id: id, mime: (mime || blob.type || 'audio/mpeg').split(';')[0], b64: b64 }, 'Ses notu Drive\'a kaydedildi 🎙')
      .then(ok => {
        if (ok) { if (UI.agsSonSes && UI.agsSonSes.id === id) { try { URL.revokeObjectURL(UI.agsSonSes.url); } catch (e) {} UI.agsSonSes = null; render(); } }
        else { UI.agsSonSes = { id: id, blob: blob, mime: mime, url: URL.createObjectURL(blob) }; UI.agsAcik[id] = true; render(); }
      });
  };
  rd.onerror = () => toast('Dosya okunamadı', 3000, true);
  rd.readAsDataURL(blob);
}
function agsSesDinle(id, fid) {
  toast('Ses notu getiriliyor…', 5000);
  srv('getSes', USER, PASS, id, fid).then(r => {
    UI.agsSesUrl[fid] = 'data:' + (r.mime || 'audio/mpeg') + ';base64,' + r.b64;
    render();
    const el = document.querySelector('[data-ags="' + id + '"] audio[src^="data:"]');
    if (el) { try { el.play(); } catch (e) {} }
  }).catch(e => toast('Ses notu alınamadı: ' + e.message, 4600, true));
}
function agsAfterInterview(studentId, yeni) {
  const agsId = UI.agsPending;
  UI.agsPending = null;
  if (!agsId || !DB) return;
  const a = agsById(agsId);
  if (!a) return;
  let sid = studentId || '';
  if (!sid && yeni) { const f = findStudentByForm(yeni.ad, yeni.tel); if (f) sid = f.id; }
  /* kaydedilen görüşme gerçekten bu adaya mı ait? telefon veya ad eşleşmeli; yoksa yalnız durum işaretlenir */
  const st = sid ? stById(sid) : null;
  const uyar = st && ((normTel(a.tel) && st.tel === normTel(a.tel)) || (adKey(st.ad) && adKey(st.ad) === adKey(a.ad)));
  const notDraft = UI.agsNotDraft[agsId];
  persist('agsGorusme', { id: agsId, ogrenciId: uyar ? st.id : '', not: notDraft }, uyar ? 'Aday görüşüldü olarak işaretlendi ve öğrenci kartına bağlandı' : 'Aday görüşüldü olarak işaretlendi')
    .then(ok => { if (ok) delete UI.agsNotDraft[agsId]; });
}
function agsTumGetir(id) {

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || !DB) return;
  const act = el.dataset.action;
  if (act === 'del-onay' && el.dataset.kind === 'agsses') {
    persist('agsSesSil', { id: el.dataset.id, fileId: el.dataset.fid }, 'Ses notu silindi');
    return;
  }
  if (!act || act.indexOf('ags-') !== 0) return;
  const id = el.dataset.id;
  if (act === 'ags-ac') {
    if (UI.agsAcik[id]) delete UI.agsAcik[id]; else UI.agsAcik[id] = true;
    render();
    const k = document.querySelector('[data-ags="' + id + '"]');
    if (k) k.scrollIntoView({ block: 'nearest' });
  }
  else if (act === 'ags-aktar-ac') { UI.agsAktar = true; render(); }    /* v34 */
  else if (act === 'ags-aktar-kapat') { UI.agsAktar = false; render(); } /* v34 */
  else if (act === 'ags-d') { UI.agsD = el.dataset.v; render(); }
  else if (act === 'ags-durum') {
    const a = agsById(id);
    const ta = document.getElementById('agsnot-' + id);
    const p = { id: id, durum: el.dataset.v };
    if (ta && a && ta.value !== (a.not || '')) p.not = ta.value; /* kaydedilmemiş not durumla birlikte gider */
    persist('agsDurum', p, el.dataset.v + ' olarak işaretlendi' + (p.not !== undefined ? ' (not kaydedildi)' : ''))
      .then(ok => { if (ok) delete UI.agsNotDraft[id]; });
  }
  else if (act === 'ags-not-kaydet') {
    const ta = document.getElementById('agsnot-' + id);
    const v = ta ? ta.value : '';
    if (v.length > AGS_NOT_MAX) { toast('Not en fazla ' + AGS_NOT_MAX + ' karakter olabilir', 4000, true); return; }
    persist('agsNot', { id: id, not: v }, 'Not kaydedildi').then(ok => { if (ok) delete UI.agsNotDraft[id]; });
  }
  else if (act === 'ags-gorusme') {
    if (ROL !== 'admin') { toast('Salt-okunur görünümdesiniz — görüşme girilemez.', 3800, true); return; }
    const a = agsById(id);
    if (!a) return;
    const ta = document.getElementById('agsnot-' + id);
    if (ta) UI.agsNotDraft[id] = ta.value;
    lsSet('kh-draft', JSON.stringify({ ogrenciAd: a.ad, tel: /^\d{10}$/.test(a.tel || '') ? a.tel : '', hedef: a.hedefPuan || '', alinan: a.sonPuan || '', sinav: a.sonSinav || '' }));
    go('yeni');
    UI.agsPending = id; /* applyRoute('yeni') pending'i silmez; formdan ayrılınca silinir */
  }
  else if (act === 'ags-kayit') { agsKayit(id); }
  else if (act === 'ags-ses-dinle') { agsSesDinle(id, el.dataset.fid); }
  else if (act === 'ags-ses-tekrar') { if (UI.agsSonSes && UI.agsSonSes.id === id) agsSesYukle(id, UI.agsSonSes.blob, UI.agsSonSes.mime); }
  else if (act === 'ags-tum') { agsTumGetir(id); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-action]');
  if (!el || !DB) return;
  const act = el.dataset.action;
  if (act === 'ags-p') { UI.agsP = el.value; render(); }
  else if (act === 'ags-i') { UI.agsI = el.value; render(); }
  else if (act === 'ags-s') { UI.agsS = el.value; render(); }
  else if (act === 'ags-ses-dosya') {
    const f = el.files && el.files[0];
    if (f) {
      const ext = (f.name.split('.').pop() || '').toLowerCase();
      const byExt = { m4a: 'audio/mp4', mp4: 'audio/mp4', aac: 'audio/aac', mp3: 'audio/mpeg', webm: 'audio/webm', ogg: 'audio/ogg', opus: 'audio/ogg', wav: 'audio/wav' };
      agsSesYukle(el.dataset.id, f, (f.type && f.type.indexOf('audio/') === 0 ? f.type : '') || byExt[ext] || 'audio/mpeg');
    }
    el.value = '';
  }
});
/* v34: AGS → kuyruk toplu aktarım formu */
document.addEventListener('submit', e => {
  const form = e.target;
  if (!DB || form.dataset.action !== 'ags-kuyruk-aktar') return;
  e.preventDefault();
  const d = {};
  new FormData(form).forEach((v, k) => { d[k] = String(v).trim(); });
  const adet = Math.max(1, Math.min(60, parseInt(d.adet, 10) || 24));
  const kapasite = Math.max(1, Math.min(30, parseInt(d.kapasite, 10) || 8));
  let gun = d.baslangic && /^\d{4}-\d{2}-\d{2}$/.test(d.baslangic) ? d.baslangic : gunEkle(todayISO(), 1);
  if (gun < todayISO()) gun = todayISO();
  const pazarAtla = t => {
    let g = t;
    while (new Date(g.slice(0, 4), Number(g.slice(5, 7)) - 1, Number(g.slice(8, 10))).getDay() === 0) g = gunEkle(g, 1);
    return g;
  };
  gun = pazarAtla(gun);
  const hedefler = agsAktarAdaylari(agsFiltre(agsList())).slice(0, adet);
  if (!hedefler.length) { toast('Aktarılacak bekleyen aday yok.', 3200, true); return; }
  let kalan = kapasite;
  const rows = hedefler.map(a => {
    if (kalan === 0) { gun = pazarAtla(gunEkle(gun, 1)); kalan = kapasite; }
    kalan--;
    return {
      ogrenciId: a.ogrenciId || '', ad: a.ad, tel: normTel(a.tel),
      eklenme: todayISO(), planTarih: gun, oncelik: '', agsId: a.id, ekleyen: 'ags-aktarim'
    };
  });
  UI.agsAktar = false;
  persist('addQueueBatch', { rows: rows }, rows.length + ' aday kuyruğa gönderildi (' + fmtDate(rows[0].planTarih) + ' – ' + fmtDate(rows[rows.length - 1].planTarih) + '; sunucu çakışanları atlar) 📞')
    .then(ok => { if (!ok) UI.agsAktar = true; });
});
let agsAraTimer = null;
document.addEventListener('input', e => {
  const el = e.target;
  if (!DB) return;
  if (el.id && el.id.indexOf('agsnot-') === 0) { UI.agsNotDraft[el.id.slice(7)] = el.value; return; }
  if (el.dataset.action !== 'agsq') return;
  UI.agsQ = el.value;
  clearTimeout(agsAraTimer);
  agsAraTimer = setTimeout(() => {
    render();
    const s = document.querySelector('input[data-action=agsq]');
    if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
  }, 220);
});
</script>
</body>
